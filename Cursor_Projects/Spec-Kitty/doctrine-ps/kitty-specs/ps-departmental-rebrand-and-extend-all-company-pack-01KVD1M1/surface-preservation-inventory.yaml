schema_version: "1.0"
mission_slug: ps-departmental-rebrand-and-extend-all-company-pack-01KVD1M1
purpose: Preserve non-generated canon before untracking generated harness surfaces.

policy:
  generated_surfaces_to_untrack:
    - .cursor/
    - .claude/
  rule: "No generated surface directory is untracked until every authored candidate below has a relocation target and verification evidence."

entries:
  - source_path: .cursor/hooks.json
    classification: authored_candidate
    rationale: "Repository-specific hook wiring; not generated by doctrine pack export."
    action: relocate_and_track
    relocate_to: tools/surfaces/cursor/hooks.json
    verification:
      - "relocated file exists at relocate_to"
      - "generated .cursor/hooks.json can be reconstructed from relocated source"
      - "git diff shows no functional drift in hook commands"

  - source_path: .cursor/hooks/check-drg-fresh.sh
    classification: authored_candidate
    rationale: "Repo-specific DRG freshness guard script."
    action: relocate_and_track
    relocate_to: tools/surfaces/cursor/hooks/check-drg-fresh.sh
    verification:
      - "script exists at relocate_to and remains executable"
      - "hook invocation path is updated to relocated source or generation pipeline"
      - "script output parity confirmed on dry run"

  - source_path: .claude/settings.json
    classification: authored_candidate
    rationale: "Non-generated local policy baseline currently tracked in repository."
    action: relocate_and_track
    relocate_to: tools/surfaces/claude/settings.json
    verification:
      - "relocated file exists and is tracked"
      - "local regeneration instructions reference relocated source"

  - source_path: .claude/CLAUDE.md
    classification: generated_or_derivative
    rationale: "Potential derivative from pack/governance sources; retain only if no canonical source exists."
    action: manual_review
    relocate_to: docs/agent-surfaces/claude-reference.md
    verification:
      - "canonical source identified or explicit keep/drop decision recorded"
      - "if dropped, equivalent guidance is reachable from tracked docs/pack source"

  - source_path: .cursor/mcp.json
    classification: local_machine_config
    rationale: "Machine/local connector config is not a shared canon artifact."
    action: keep_ignored
    relocate_to: ""
    verification:
      - ".gitignore contains .cursor/mcp.json"

readiness_gate:
  required_before_untracking:
    - "All authored_candidate entries have relocate_to populated and files created."
    - "Verification checks are attached in implementation evidence."
    - "Generated directories are removed from git index only after relocation commit."
