  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"05c2b9dd-cc27-4545-a973-cfe8bedcdfdf\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n@font-face{font-family:\"Regnology Sans\";src:url(\"b31a5787-a5c9-4146-88c9-cf3b9e5dce00\") format(\"woff2\");font-weight:400;font-style:normal;font-display:swap;}\n@font-face{font-family:\"Regnology Sans\";src:url(\"c369a1ba-f07f-4ef9-ba47-60d43ef2179a\") format(\"woff2\");font-weight:400;font-style:italic;font-display:swap;}\n@font-face{font-family:\"Regnology Sans\";src:url(\"37507f5c-84ee-4e6a-b170-a160fbb614b5\") format(\"woff2\");font-weight:500;font-style:normal;font-display:swap;}\n*{box-sizing:border-box;}\nhtml,body{margin:0;font-family:\"Regnology Sans\",Arial,system-ui,sans-serif;background:#EEF1F1;color:#012D3F;-webkit-font-smoothing:antialiased;}\na{color:#1788BE;text-decoration:underline;text-underline-offset:2px;}\na:hover{color:#06A74E;}\ninput,select,button{font-family:inherit;}\n::selection{background:#3CE55A;color:#012D3F;}\ninput::placeholder{color:#9FA8A9;}\n.reg-scroll::-webkit-scrollbar{height:10px;width:10px;}\n.reg-scroll::-webkit-scrollbar-thumb{background:#C6CFCF;border-radius:99px;}\n[data-grid=\"detail\"] > [data-wide=\"3\"]{grid-column:span 3;}\n[data-grid=\"detail\"] > [data-wide=\"4\"]{grid-column:span 4;}\n@media (max-width:1000px){\n  [data-grid=\"summary\"]{grid-template-columns:minmax(0,1fr) !important;}\n  [data-grid=\"kpi\"]{grid-template-columns:repeat(3,minmax(0,1fr)) !important;}\n  [data-grid=\"detail\"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}\n  [data-grid=\"detail\"] > [data-wide]{grid-column:span 2 !important;}\n}\n@media (max-width:620px){\n  [data-grid=\"kpi\"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}\n  [data-grid=\"detail\"]{grid-template-columns:minmax(0,1fr) !important;}\n  [data-grid=\"detail\"] > [data-wide]{grid-column:span 1 !important;}\n}\n<\u002Fstyle>\n<script src=\"9d15637e-211b-4971-8f29-69723675a214\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"width:100%;max-width:2200px;margin:0 auto;padding:clamp(14px,2vw,28px) clamp(14px,2vw,28px) 64px;\">\n\n  <header style=\"background:#012D3F;border-radius:20px;padding:30px 34px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;overflow:hidden;position:relative;\">\n    <div style=\"position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(60,229,90,0.14),transparent 68%);\"><\u002Fdiv>\n    <div style=\"position:relative;\">\n      <div style=\"font-weight:500;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#3CE55A;margin-bottom:14px;\">Project portfolio<\u002Fdiv>\n      <h1 style=\"margin:0 0 10px;font-weight:400;font-size:38px;line-height:1.02;color:#fff;letter-spacing:-0.01em;\">Project delivery summary<\u002Fh1>\n      <p style=\"margin:0;font-size:15px;color:#9FA8A9;max-width:620px;\">{{ subtitle }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:16px;flex-shrink:0;\">\n      <img src=\"bbed60cc-5b30-4347-a7c9-e38d7ce34101\" alt=\"Regnology\" style=\"height:24px;display:block;\">\n      <div style=\"text-align:right;\">\n        <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#747A7A;\">Reporting date<\u002Fdiv>\n        <div style=\"font-size:15px;color:#E1E6E6;margin-top:3px;\">{{ today }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;margin-top:20px;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-shrink:0;\">\n      <span style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#06A74E;font-weight:500;\">Data feed<\u002Fspan>\n      <span style=\"{{ srcBadgeStyle }}\"><span style=\"{{ srcDotStyle }}\"><\u002Fspan>{{ srcBadge }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;background:#EEF1F1;border-radius:99px;padding:3px;gap:2px;\">\n      <button sc-camel-on-click=\"{{ mode.auto }}\" style=\"{{ tabAutoStyle }}\">Auto-connect<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ mode.file }}\" style=\"{{ tabFileStyle }}\">Local file<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isAuto }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;flex:1;min-width:300px;\">\n        <sc-if value=\"{{ fsNotConnected }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ fsPick }}\" style=\"padding:8px 16px;border-radius:99px;border:none;background:#012D3F;color:#fff;font-size:13px;font-weight:500;cursor:pointer;\">Connect Excel file…<\u002Fbutton>\n          <span style=\"font-size:12px;color:#747A7A;\">One-time setup — pick the file once and it is remembered.<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ fsConnected }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:rgba(6,167,78,0.12);color:#06813d;font-size:13px;font-weight:500;\"><span style=\"width:7px;height:7px;border-radius:99px;background:#06A74E;\"><\u002Fspan>{{ fsName }}<\u002Fspan>\n          <span style=\"font-size:12px;color:#9FA8A9;\">{{ fsSyncLabel }}<\u002Fspan>\n          <sc-if value=\"{{ fsNeedsGrant }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ fsGrant }}\" style=\"padding:8px 16px;border-radius:99px;border:none;background:#EC9D1C;color:#fff;font-size:13px;font-weight:500;cursor:pointer;\">Grant access to read<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ fsRefresh }}\" style=\"padding:8px 14px;border-radius:99px;border:none;background:#06A74E;color:#fff;font-size:13px;font-weight:500;cursor:pointer;\">Refresh now<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fsToggleAuto }}\" style=\"{{ fsAutoStyle }}\">Auto-refresh every 30s<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fsPick }}\" style=\"padding:8px 13px;border:1px solid #E1E6E6;border-radius:99px;font-size:12px;color:#747A7A;background:#fff;cursor:pointer;\" style-hover=\"border-color:#9FA8A9;color:#012D3F;\">Change file<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fsDisconnect }}\" style=\"padding:8px 13px;border:1px solid #E1E6E6;border-radius:99px;font-size:12px;color:#747A7A;background:#fff;cursor:pointer;\" style-hover=\"border-color:#C62828;color:#C62828;\">Disconnect<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ fsUnsupported }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex-basis:100%;font-size:11px;color:#C62828;line-height:1.4;\">This browser does not support remembered file connections. Use <b style=\"font-weight:500;\">Chrome<\u002Fb> or <b style=\"font-weight:500;\">Edge<\u002Fb>, or load the workbook via <b style=\"font-weight:500;\">Local file<\u002Fb>.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ fsSupported }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex-basis:100%;font-size:11px;color:#9FA8A9;line-height:1.4;\">The dashboard remembers a reference to the workbook (not a path) and re-reads it on every load, so scheduled updates to the file appear automatically. For security the browser asks you to confirm access once per session — that is the <b style=\"font-weight:500;\">Grant access<\u002Fb> button. Chrome/Edge only.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFile }}\" hint-placeholder-val=\"{{ false }}\">\n      <label style=\"display:inline-flex;align-items:center;gap:10px;cursor:pointer;\">\n        <span style=\"padding:8px 16px;border-radius:99px;background:#012D3F;color:#fff;font-size:13px;font-weight:500;\">Choose .xlsx file<\u002Fspan>\n        <span style=\"font-size:13px;color:#747A7A;\">{{ fileHint }}<\u002Fspan>\n        <input type=\"file\" accept=\".xlsx,.xls,.csv\" sc-camel-on-change=\"{{ onFile }}\" style=\"position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;\">\n      <\u002Flabel>\n      <div style=\"flex-basis:100%;font-size:11px;color:#9FA8A9;line-height:1.4;\">Reads any file on your machine <b style=\"font-weight:500;\">or a mapped network drive<\u002Fb> — in the picker, browse to the network location (e.g. <b style=\"font-weight:500;\">\\\\WIN-BMVMND4\\Users\\NileshKumar\\Downloads<\u002Fb>) and select the workbook. This is the reliable way to load shared-folder files.<\u002Fdiv>\n    <\u002Fsc-if>\n\n\n    <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:13px;color:#1788BE;\">Reading workbook…<\u002Fspan>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"font-size:13px;color:#C62828;max-width:520px;\">{{ error }}<\u002Fspan>\n    <\u002Fsc-if>\n\n  <\u002Fsection>\n\n  <section data-grid=\"kpi\" style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:16px;\">\n    <div sc-camel-on-click=\"{{ pick.all }}\" style=\"background:#012D3F;border-radius:16px;padding:18px 18px 16px;cursor:pointer;\">\n      <div style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#9FA8A9;\">Total<\u002Fdiv>\n      <div style=\"font-size:40px;font-weight:400;color:#fff;line-height:1;margin-top:8px;\">{{ total }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#3CE55A;margin-top:6px;\">engagements<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ pick.green }}\" style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(1,45,63,.05);\">\n      <div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"width:9px;height:9px;border-radius:99px;background:#06A74E;\"><\u002Fspan><span style=\"font-size:12px;color:#747A7A;\">Green<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:400;line-height:1;margin-top:10px;\">{{ nGreen }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#9FA8A9;margin-top:5px;\">{{ pctGreen }}% on track<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ pick.yellow }}\" style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(1,45,63,.05);\">\n      <div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"width:9px;height:9px;border-radius:99px;background:#EC9D1C;\"><\u002Fspan><span style=\"font-size:12px;color:#747A7A;\">Amber<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:400;line-height:1;margin-top:10px;\">{{ nYellow }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#9FA8A9;margin-top:5px;\">at risk<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ pick.red }}\" style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(1,45,63,.05);\">\n      <div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"width:9px;height:9px;border-radius:99px;background:#C62828;\"><\u002Fspan><span style=\"font-size:12px;color:#747A7A;\">Red<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:400;line-height:1;margin-top:10px;\">{{ nRed }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#9FA8A9;margin-top:5px;\">critical<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ pick.blank }}\" style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(1,45,63,.05);\">\n      <div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"width:9px;height:9px;border-radius:99px;background:#9FA8A9;\"><\u002Fspan><span style=\"font-size:12px;color:#747A7A;\">Unrated<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:400;line-height:1;margin-top:10px;\">{{ nBlank }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#9FA8A9;margin-top:5px;\">no RAG set<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ pick.onhold }}\" style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(1,45,63,.05);\">\n      <div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"width:9px;height:9px;border-radius:99px;background:#1788BE;\"><\u002Fspan><span style=\"font-size:12px;color:#747A7A;\">On hold<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:400;line-height:1;margin-top:10px;\">{{ nOnHold }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#9FA8A9;margin-top:5px;\">paused<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-grid=\"summary\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px;\">\n    <div style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:22px;\">\n      <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#06A74E;font-weight:500;\">RAG status mix<\u002Fdiv>\n      <div style=\"display:flex;height:14px;border-radius:99px;overflow:hidden;margin:18px 0 18px;background:#EEF1F1;\">\n        <sc-for list=\"{{ statusMix }}\" as=\"seg\" hint-placeholder-count=\"4\"><div style=\"{{ seg.barStyle }}\"><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ statusMix }}\" as=\"seg\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid #F0F3F3;\">\n          <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"{{ seg.dotStyle }}\"><\u002Fspan><span style=\"font-size:13px;color:#012D3F;\">{{ seg.label }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;color:#747A7A;\"><span style=\"color:#012D3F;font-weight:500;\">{{ seg.count }}<\u002Fspan> · {{ seg.pct }}%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #F0F3F3;display:flex;align-items:center;gap:12px;\">\n        <div style=\"font-size:32px;font-weight:400;color:#C62828;line-height:1;\">{{ nAtRisk }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#747A7A;line-height:1.3;\">projects flagged<br>amber or red<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:22px;\">\n      <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#06A74E;font-weight:500;\">By stage<\u002Fdiv>\n      <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:13px;\">\n        <sc-for list=\"{{ stageMix }}\" as=\"st\" hint-placeholder-count=\"6\">\n          <div>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;\">\n              <span style=\"font-size:13px;color:#012D3F;\">{{ st.label }}<\u002Fspan>\n              <span style=\"font-size:13px;color:#747A7A;\"><span style=\"color:#012D3F;font-weight:500;\">{{ st.count }}<\u002Fspan> · {{ st.pct }}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:9px;background:#EEF1F1;border-radius:99px;overflow:hidden;\"><div style=\"{{ st.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #E1E6E6;border-radius:16px;padding:22px;\">\n      <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#06A74E;font-weight:500;\">By region<\u002Fdiv>\n      <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:13px;\">\n        <sc-for list=\"{{ regionMix }}\" span style=\"display:flex;align-items:center;gap:14px;font-size:12px;color:#9FA8A9;\">Drag a column edge to resize · Click any row for full detail<button sc-camel-on-click=\"{{ resetCols }}\" style=\"padding:5px 11px;border:1px solid #E1E6E6;border-radius:99px;font-size:12px;color:#747A7A;background:#fff;cursor:pointer;\" style-hover=\"border-color:#9FA8A9;color:#012D3F;\">Reset columns<\u002Fbutton><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <p style=\"font-size:11px;color:#9FA8A9;margin:16px 4px 0;\">Source: Project Portfolio tracker · Regnology DocOps · RAG reflects the latest recorded status.<\u002Fp>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:1180}}\">\nclass Component extends DCLogic {\n  state = { search:\"\", status:\"All\", stage:\"All\", regionSel:[], countrySel:[], managerSel:[], projectSel:[], openMenu:null,\n            favs:[], favName:\"\", showFavSave:false, projSearch:\"\",\n            fsHandle:null, fsName:\"\", fsNeedsGrant:false, fsAuto:false, fsSyncedAt:\"\",\n            colW:[300,150,80,80,120,260,120],\n            sortKey:\"stage\", sortDir:\"asc\", expanded:{},\n            source:\"auto\", dataRows:null, loading:false, error:\"\", fileName:\"\", spUrl:\"\" };\n\n  // ---- sample fallback (Middle East demo book) ----\n  sample = [\n    [\"Agnes De Vera\",\"Azad Shaik\",\"WIO Bank Banking Cloud & ALM FIT\",\"WIO Bank\",\"GREEN\",\"3. Implementation / In progress\",\"AE\",\"MEA\",\"RRH\",\"GREEN\",\"Delivery tracking to plan\",\"2026-08-21\",\"Azad Shaik\"],\n    [\"Agnes De Vera\",\"Azad Shaik\",\"Emirates NBD IRRBB (CBUAE)\",\"Emirates NBD\",\"GREEN\",\"3. Implementation / In progress\",\"AE\",\"MEA\",\"RRH\",\"AMBER\",\"Resourcing recovered after Q2 ramp-up\",\"2026-08-24\",\"Agnes De Vera\"],\n    [\"Agnes De Vera\",\"Azad Shaik\",\"SIB IRRBB\",\"Sharjah Islamic Bank\",\"AMBER\",\"3. Implementation / In progress\",\"AE\",\"MEA\",\"RSH\",\"GREEN\",\"Client-side data readiness delayed UAT entry\",\"2026-08-18\",\"Agnes De Vera\"],\n    [\"Hayath Afrose\",\"Ahmed AlKhaja\",\"Bank Misr IFRS9 Implementation\",\"Bank Misr\",\"RED\",\"3. Implementation / In progress\",\"EG\",\"MEA\",\"RRH\",\"AMBER\",\"Scope change pending approval; milestone at risk\",\"2026-08-25\",\"Hayath Afrose\"],\n    [\"Hayath Afrose\",\"Ahmed AlKhaja\",\"UAB IFRS9-Basel ALM RAROC\",\"United Arab Bank\",\"AMBER\",\"3. Implementation / In progress\",\"AE\",\"MEA\",\"RSH\",\"AMBER\",\"Key SME rolled off, backfill in progress\",\"2026-08-19\",\"Hayath Afrose\"],\n    [\"Kentish Bundhun\",\"Azad Shaik\",\"ABC Basel IV\",\"Arab Banking Corporation\",\"GREEN\",\"3. Implementation / In progress\",\"BH\",\"MEA\",\"RRH\",\"GREEN\",\"On plan, no open risks\",\"2026-08-20\",\"Kentish Bundhun\"],\n    [\"Martin Allaire\",\"Ahmed AlKhaja\",\"KFH IFRS9 Extended Support\",\"Kuwait Finance House\",\"GREEN\",\"6. Post Go Live support\",\"KW\",\"MEA\",\"RRH\",\"GREEN\",\"Steady-state support, no escalations\",\"2026-07-31\",\"Martin Allaire\"],\n    [\"Martin Allaire\",\"Azad Shaik\",\"Mashreqbank Oman MVP2 Basel\",\"Mashreqbank Oman\",\"GREEN\",\"3. Implementation / In progress\",\"OM\",\"MEA\",\"RRH\",\"GREEN\",\"MVP2 build on schedule\",\"2026-08-26\",\"Martin Allaire\"],\n    [\"New / Unassigned\",\"Azad Shaik\",\"ABC Retail PD Integration\",\"Arab Banking Corporation\",\"\",\"1. Initiation\",\"BH\",\"MEA\",\"RSH\",\"\",\"Awaiting kickoff and PM assignment\",\"2026-08-12\",\"Azad Shaik\"],\n    [\"New / Unassigned\",\"—\",\"GIB Basel 4 Implementation\",\"Gulf International Bank\",\"\",\"1. Initiation\",\"BH\",\"MEA\",\"RRH\",\"\",\"New intake, mobilisation pending\",\"2026-08-05\",\"Asif Khan\"],\n    [\"Pooja Patil\",\"Azad Shaik\",\"ADCB RiskAuthority Optimization\",\"ADCB\",\"GREEN\",\"3. Implementation / In progress\",\"AE\",\"MEA\",\"RSH\",\"GREEN\",\"Performance targets met in latest cycle\",\"2026-08-23\",\"Pooja Patil\"],\n    [\"Praneet Joshi\",\"Ahmed AlKhaja\",\"Credit Agricole Egypt IFRS9\",\"Credit Agricole Egypt\",\"GREEN\",\"8. Complete\",\"EG\",\"MEA\",\"RRH\",\"GREEN\",\"Closed and signed off\",\"2026-06-30\",\"Praneet Joshi\"],\n  ];\n\n  META = {\n    Green:  { label:\"Green\",   color:\"#06A74E\", bg:\"rgba(6,167,78,0.12)\",  text:\"#06813d\", rank:4 },\n    Yellow: { label:\"Amber\",   color:\"#EC9D1C\", bg:\"rgba(236,157,28,0.16)\", text:\"#9a6606\", rank:2 },\n    Red:    { label:\"Red\",     color:\"#C62828\", bg:\"rgba(198,40,40,0.12)\",  text:\"#C62828\", rank:1 },\n    New:    { label:\"New\",     color:\"#1788BE\", bg:\"rgba(23,136,190,0.12)\", text:\"#12729f\", rank:5 },\n    Blank:  { label:\"Unrated\", color:\"#9FA8A9\", bg:\"rgba(159,168,169,0.20)\",text:\"#747A7A\", rank:3 },\n  };\n  ORDER = [\"Green\",\"Yellow\",\"Red\",\"New\",\"Blank\"];\n  REGION_FULL = { APAC:\"APAC\", EMEA:\"EMEA\", AMERICAS:\"Americas\", MEA:\"Middle East & Africa\" };\n\n  normStatus(v){\n    const s=(v||\"\").toString().trim().toLowerCase();\n    if(!s) return \"Blank\";\n    if(/(green|on track|complete|good|\\bok\\b)/.test(s)) return \"Green\";\n    if(/(amber|yellow|at risk|watch|caution)/.test(s)) return \"Yellow\";\n    if(/(red|critical|escalat|blocked)/.test(s)) return \"Red\";\n    if(/new/.test(s)) return \"New\";\n    return \"Blank\";\n  }\n  clean(v){ return (v??\"\").toString().split(\";#\")[0].replace(/;$/,\"\").trim(); }\n  fmtDate(v){\n    if(v==null||v===\"\") return \"\";\n    const MON=[\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\n    const F=d=>isNaN(d)?\"\":((\"0\"+d.getUTCDate()).slice(-2)+\" \"+MON[d.getUTCMonth()]+\" \"+d.getUTCFullYear());\n    if(v instanceof Date) return F(v);\n    if(typeof v===\"number\") return F(new Date(Date.UTC(1899,11,30)+v*86400000));\n    const s=v.toString().trim();\n    if(/^\\d{4,6}(\\.\\d+)?$/.test(s)) return F(new Date(Date.UTC(1899,11,30)+parseFloat(s)*86400000));\n    const m=s.match(/^(\\d{1,2})[\\/\\-.](\\d{1,2})[\\/\\-.](\\d{4})/);   // DD/MM/YYYY\n    if(m) return F(new Date(Date.UTC(+m[3],+m[2]-1,+m[1])));\n    const out=F(new Date(s));\n    return out||s;\n  }\n  FAV_KEY=\"regnology.portfolio.favs.v1\";\n  COLW_KEY=\"regnology.portfolio.colw.v1\";\n  MINW=[140,90,56,56,90,120,90];\n  componentDidMount(){\n    try{ const raw=localStorage.getItem(this.FAV_KEY); if(raw) this.setState({ favs:JSON.parse(raw)||[] }); }catch(e){}\n    try{ const w=localStorage.getItem(this.COLW_KEY); if(w){ const a=JSON.parse(w); if(Array.isArray(a)&&a.length===7) this.setState({ colW:a }); } }catch(e){}\n    if(this.fsSupported()){\n      this.idbGet().then(async h=>{\n        if(!h) return;\n        this.setState({ fsHandle:h, fsName:h.name, source:\"auto\" });\n        const ok=await this.ensurePermission(h,false);\n        if(ok) this.readFeed(h,false); else this.setState({ fsNeedsGrant:true });\n      }).catch(()=>{});\n    }\n  }\n  startResize(i,e){\n    e.preventDefault(); e.stopPropagation();\n    const startX=e.clientX, startW=this.state.colW[i], min=this.MINW[i];\n    const move=ev=>{ const w=Math.max(min, Math.round(startW+(ev.clientX-startX)));\n      this.setState(st=>{ const a=st.colW.slice(); a[i]=w; return { colW:a }; }); };\n    const up=()=>{ document.removeEventListener(\"mousemove\",move); document.removeEventListener(\"mouseup\",up);\n      document.body.style.cursor=\"\"; document.body.style.userSelect=\"\";\n      try{ localStorage.setItem(this.COLW_KEY, JSON.stringify(this.state.colW)); }catch(err){} };\n    document.addEventListener(\"mousemove\",move); document.addEventListener(\"mouseup\",up);\n    document.body.style.cursor=\"col-resize\"; document.body.style.userSelect=\"none\";\n  }\n  resetCols(){ const d=[300,150,80,80,120,260,120]; this.setState({ colW:d }); try{ localStorage.setItem(this.COLW_KEY, JSON.stringify(d)); }catch(e){} }\n  persistFavs(favs){ try{ localStorage.setItem(this.FAV_KEY, JSON.stringify(favs)); }catch(e){} }\n  saveFav(){\n    const S=this.state; const name=(S.favName||\"\").trim(); if(!name) return;\n    const entry={ name, regionSel:S.regionSel, countrySel:S.countrySel, managerSel:S.managerSel, projectSel:S.projectSel, status:S.status, stage:S.stage, search:S.search };\n    const favs=[...S.favs.filter(f=>f.name!==name), entry];\n    this.persistFavs(favs);\n    this.setState({ favs, favName:\"\", showFavSave:false, openMenu:null });\n  }\n  applyFav(f){ this.setState({ regionSel:f.regionSel||[], countrySel:f.countrySel||[], managerSel:f.managerSel||[], projectSel:f.projectSel||[], status:f.status||\"All\", stage:f.stage||\"All\", search:f.search||\"\", openMenu:null, expanded:{} }); }\n  deleteFav(name){ const favs=this.state.favs.filter(f=>f.name!==name); this.persistFavs(favs); this.setState({ favs }); }\n  stageLabel(raw){ return (raw||\"\").toString().replace(/^\\s*\\d+\\.\\s*/,\"\").trim() || \"—\"; }\n  stageOrder(raw){ const m=(raw||\"\").toString().match(/^\\s*(\\d+)\\./); return m?+m[1]:99; }\n  isOnHold(raw){ return /on hold/i.test(raw||\"\"); }\n  stageColor(raw){\n    if(this.isOnHold(raw)) return \"#1788BE\";\n    if(/complete|go live|post go/i.test(raw)) return \"#06A74E\";\n    if(/initiation|planning|design/i.test(raw)) return \"#EC9D1C\";\n    return \"#3CE55A\";\n  }\n\n  // build a uniform record from either the sample array or an imported object\n  rec(o){\n    const orig=(o.name||\"\").toString().trim();\n    const client=(o.client||\"\").toString().trim();\n    return {\n      manager: o.manager||\"—\", oversight: o.oversight||\"—\",\n      client: client||\"—\", code: o.code||\"—\",\n      name: client || orig || \"—\", orig: orig,\n      contract: (o.contract||\"\").toString().trim(), product: (o.product||\"\").toString().trim(),\n      subproduct: (o.subproduct||\"\").toString().trim(), module: (o.module||\"\").toString().trim(),\n      impl: (o.impl||\"\").toString().trim(),\n      reason: (o.reason||\"\").toString().trim(), backToGreen: (o.backToGreen||\"\").toString().trim(),\n      modified: this.fmtDate(o.modified), modifiedBy: this.clean(o.modifiedBy)||\"\",\n      comment: (o.comment||\"\").toString().trim(),\n      lastStatusRaw: (o.lastStatus||\"\").toString().trim(), lastStatus: this.normStatus(o.lastStatus),\n      status: this.normStatus(o.status), stageRaw: o.stage||\"\",\n      country: (o.country||\"\").toString().trim(), region: (o.region||\"\").toString().trim(),\n    };\n  }\n  cleanName(s){ s=(s||\"\").toString(); if(s.includes(\"@\")) s=s.split(\"@\").pop(); return s.replace(/[_@]+/g,\" \").replace(/\\s{2,}/g,\" \").trim(); }\n  // Pull the \"what is being implemented\" part out of the source project name\n  scopeFromSource(o){\n    let s=(o.orig||\"\").toString().trim();\n    if(!s) return \"\";\n    if(s.includes(\"@\")) s=s.split(\"@\").pop().trim();          // drop TCV_FP@ style prefixes\n    const client=(o.client||\"\").trim();\n    const isCode=x=>/^[\\d.\\-\\s]+$/.test(x) || /^\\d{4,}/.test(x) || /^(pr|pj|prj)[-_ ]?\\d+$/i.test(x) || /^[a-z]{2,4}[-_]\\d+$/i.test(x);\n\n    // pull out parenthesised groups: codes become a trailing ref, words stay as scope\n    const parens=[]; s=s.replace(/\\(([^)]*)\\)/g,(m,g)=>{ parens.push(g.trim()); return \" \"; });\n    const codeRefs=parens.filter(isCode);\n    const wordParens=parens.filter(x=>x && !isCode(x));\n\n    const clientWords=client.toLowerCase().replace(/[^a-z0-9 ]/g,\" \").split(/\\s+/).filter(w=>w.length>2);\n    const isClientish=x=>{ const l=x.toLowerCase().replace(/[^a-z0-9 ]/g,\" \").trim();\n      if(!l) return true;\n      if(client && l===client.toLowerCase().replace(/[^a-z0-9 ]/g,\" \").trim()) return true;\n      if(!clientWords.length) return false;\n      const w=l.split(/\\s+/).filter(Boolean);\n      const hits=w.filter(t=>clientWords.some(c=>c.startsWith(t)||t.startsWith(c))).length;\n      return w.length>0 && hits/w.length>=0.6; };\n\n    // strip only the client-matching WORDS from e
