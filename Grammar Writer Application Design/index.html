document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"105a5792-795c-4f95-a685-4943454112cb\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  @font-face{font-family:\"Regnology Sans\";src:url(\"ab2a3ec6-14f5-42ac-8fea-d2e77d1a4704\") format(\"woff2\");font-weight:400;font-style:normal;font-display:swap;}\n  @font-face{font-family:\"Regnology Sans\";src:url(\"421257ca-1908-4c39-bccf-bd39ad222aee\") format(\"woff2\");font-weight:500;font-style:normal;font-display:swap;}\n  @font-face{font-family:\"Regnology Sans\";src:url(\"9e350016-f3cc-4bda-8c9b-25765baa24a3\") format(\"woff2\");font-weight:400;font-style:italic;font-display:swap;}\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;font-family:\"Regnology Sans\",Arial,system-ui,sans-serif;color:#012D3F;-webkit-font-smoothing:antialiased;}\n  @keyframes gw-spin{to{transform:rotate(360deg);}}\n  ::selection{background:#3CE55A;color:#012D3F;}\n  textarea,input{font-family:inherit;}\n  textarea:focus,input:focus{outline:none;border-color:#06A74E !important;}\n  .gw-scroll::-webkit-scrollbar{width:9px;height:9px;}\n  .gw-scroll::-webkit-scrollbar-thumb{background:#C9D2D2;border-radius:8px;}\n  .gw-scroll::-webkit-scrollbar-track{background:transparent;}\n<\u002Fstyle>\n<script>\n  /* ===== SHARED LLM KEY ====================================================\n     Replace __REGNOLOGY_SHARED_GEMINI_KEY__ below with your Gemini API key.\n     This works in BOTH builds: the folder version and the single-file\n     \"Grammar Writer (standalone).html\" — just open the file in a text editor,\n     find that token, paste your key, save. No rebuild needed.\n     A baked-in key is visible to anyone who can open this file, so use it\n     only for internal / trusted local deployments. To use Claude instead,\n     fill claudeKey and the app's Settings → Claude tab. */\n  window.GW_CONFIG = {\n    geminiKey:   \"\",\n    geminiModel: \"gemini-3.1-flash-lite\",\n    claudeKey:   \"\",\n    claudeModel: \"claude-sonnet-4-20250514\"\n  };\n<\u002Fscript>\n<script src=\"6c96b209-cead-4c43-9182-ff34423e6ce8\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<div style=\"height:100vh;display:flex;flex-direction:column;background:#FFFFFF;overflow:hidden;\">\n  <!-- TOP BAR -->\n  <div style=\"height:58px;background:#012D3F;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex:none;z-index:5;\">\n    <div style=\"display:flex;align-items:center;gap:13px;\">\n      <img src=\"7df4e11f-27ec-445a-ace7-9bca09bae733\" alt=\"Regnology\" style=\"height:26px;width:auto;display:block;\">\n      <span style=\"color:#fff;font-size:17px;font-weight:500;\">Grammar Writer<\u002Fspan>\n      <span style=\"color:#9FA8A9;font-size:12.5px;border-left:1px solid rgba(255,255,255,.18);padding-left:13px;\">Regulatory expression composer<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:18px;\">\n      <span style=\"color:#9FA8A9;font-size:12px;display:flex;align-items:center;gap:7px;\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ providerDotColor }};display:inline-block;\"><\u002Fspan>{{ providerStatus }}<\u002Fspan>\n      <button onclick=\"{{ onOpenSettings }}\" style=\"background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E1E6E6;font-size:13px;font-family:inherit;border-radius:8px;padding:7px 14px;cursor:pointer;\">Settings<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;display:flex;min-height:0;\">\n    <!-- LEFT: grammar types + history -->\n    <div class=\"gw-scroll\" style=\"width:256px;background:#F4F6F6;border-right:1px solid #E1E6E6;flex:none;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n        <span style=\"font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#747A7A;\">Grammar types<\u002Fspan>\n        <span onclick=\"{{ onResetAuto }}\" style=\"font-size:11px;color:#06A74E;cursor:pointer;letter-spacing:.04em;\">{{ autoResetLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:22px;\">\n        <sc-for list=\"{{ grammarTags }}\" as=\"tag\" hint-placeholder-count=\"9\">\n          <div onclick=\"{{ tag.onClick }}\" title=\"{{ tag.title }}\" style=\"{{ tag.style }}\">\n            <span>{{ tag.name }}<\u002Fspan>\n            <sc-if value=\"{{ tag.showAuto }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9.5px;font-weight:500;letter-spacing:.12em;color:#06A74E;\">AUTO {{ tag.confLabel }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ tag.showPinned }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9.5px;font-weight:500;letter-spacing:.12em;color:#fff;background:#06A74E;border-radius:4px;padding:1px 5px;\">PINNED<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n        <span style=\"font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#747A7A;\">History<\u002Fspan>\n        <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ false }}\"><span onclick=\"{{ onClearHistory }}\" style=\"font-size:11px;color:#9FA8A9;cursor:pointer;\">Clear<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <sc-for list=\"{{ historyList }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div onclick=\"{{ h.onClick }}\" style=\"{{ h.style }}\">\n              <div style=\"font-size:13px;color:#012D3F;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;\">{{ h.ask }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:5px;\">\n                <span style=\"font-size:10.5px;color:#9FA8A9;\">{{ h.meta }}<\u002Fspan>\n                <span onclick=\"{{ h.onDelete }}\" style=\"font-size:11px;color:#C9D2D2;cursor:pointer;padding:0 2px;\">✕<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12.5px;color:#9FA8A9;line-height:1.5;\">Your generated formulas are saved here automatically.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- CENTER: composer + result -->\n    <div class=\"gw-scroll\" style=\"flex:1;min-width:0;overflow:auto;padding:26px 30px 40px;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;\">\n        <span style=\"font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#06A74E;\">Requirement<\u002Fspan>\n        <span style=\"font-size:12px;color:#9FA8A9;\">Describe what you want to select, in plain language<\u002Fspan>\n      <\u002Fdiv>\n      <textarea oninput=\"{{ onAskInput }}\" value=\"{{ ask }}\" placeholder=\"e.g. Select all fixed-rate loans with a nominal above 1 million that mature within the next year.\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid #C9D2D2;border-radius:12px;padding:15px;font-size:15px;color:#012D3F;line-height:1.55;background:#fff;\"><\u002Ftextarea>\n\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px;flex-wrap:wrap;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <span style=\"font-size:12px;color:#747A7A;\">Grammar<\u002Fspan>\n          <sc-if value=\"{{ sc-if>\n              <\u002Fdiv>\n              <button onclick=\"{{ onCopy }}\" style=\"background:#fff;border:1px solid #C9D2D2;border-radius:8px;padding:6px 14px;font-size:13px;color:#012D3F;font-family:inherit;cursor:pointer;\">{{ copyLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <pre style=\"background:#012D3F;border-radius:14px;padding:20px 22px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:14.5px;line-height:1.7;color:#E1E6E6;white-space:pre-wrap;word-break:break-word;margin:0;\">{{ result.formula }}<\u002Fpre>\n\n            <!-- validation -->\n            <div style=\"{{ validation.boxStyle }}\">\n              <span style=\"{{ validation.iconStyle }}\">{{ validation.icon }}<\u002Fspan>\n              <div style=\"flex:1;\">\n                <div style=\"{{ validation.titleStyle }}\">{{ validation.title }}<\u002Fdiv>\n                <sc-if value=\"{{ validation.hasDetail }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:#7a6020;line-height:1.5;margin-top:3px;\">{{ validation.detail }}<\u002Fdiv><\u002Fsc-if>\n                <sc-if value=\"{{ validation.hasUnknown }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;\">\n                    <sc-for list=\"{{ validation.unknown }}\" as=\"u\" hint-placeholder-count=\"2\"><span style=\"background:#fff;border:1px solid #e3c98a;border-radius:6px;padding:2px 9px;font-size:12px;font-family:'SFMono-Regular',Consolas,monospace;color:#8a5a08;\">{{ u.token }}<\u002Fspan><\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ validation.hasIssues }}\" hint-placeholder-val=\"{{ false }}\">\n                  <ul style=\"margin:8px 0 0;padding-left:18px;\">\n                    <sc-for list=\"{{ validation.issues }}\" as=\"iss\" hint-placeholder-count=\"1\"><li style=\"font-size:13px;color:#7a6020;line-height:1.5;\">{{ iss.text }}<\u002Fli><\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- explanation -->\n            <div style=\"font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#747A7A;margin:24px 0 9px;\">Explanation<\u002Fdiv>\n            <p style=\"font-size:14.5px;color:#3a4444;line-height:1.6;margin:0;\">{{ result.explanation }}<\u002Fp>\n\n            <!-- elements used -->\n            <sc-if value=\"{{ hasElementsUsed }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#747A7A;margin:24px 0 9px;\">Elements used<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n                <sc-for list=\"{{ elementsUsed }}\" as=\"e\" hint-placeholder-count=\"3\"><span style=\"border:1px solid #E1E6E6;border-radius:6px;padding:4px 10px;font-size:12.5px;color:#3a4444;font-family:'SFMono-Regular',Consolas,monospace;\">{{ e.element }} <span style=\"color:#9FA8A9;font-family:inherit;\">{{ e.category }}<\u002Fspan><\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px solid #EEF1F1;border-radius:16px;padding:40px 34px;background:#FAFBFB;\">\n            <div style=\"font-size:16px;color:#012D3F;font-weight:500;margin-bottom:14px;\">Turn a requirement into a valid expression<\u002Fdiv>\n            <ol style=\"margin:0;padding-left:20px;color:#3a4444;font-size:14px;line-height:1.9;\">\n              <li>Type your ask above — the matching grammar is detected automatically.<\u002Fli>\n              <li>Override the grammar any time from the list on the left.<\u002Fli>\n              <li>Generate to get a formula that follows the grammar, with an explanation px;color:#C9D2D2;\">{{ grp.count }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                <sc-for list=\"{{ grp.items }}\" as=\"el\" hint-placeholder-count=\"3\">\n                  <div onclick=\"{{ el.onClick }}\" title=\"Copy syntax\" style=\"border:1px solid #E1E6E6;border-radius:9px;padding:10px 12px;background:#fff;cursor:pointer;\">\n                    <div style=\"font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;color:#012D3F;line-height:1.4;word-break:break-word;\">{{ el.element }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:#747A7A;margin-top:4px;line-height:1.45;\">{{ el.description }}<\u002Fdiv>\n                    <sc-if value=\"{{ el.hasExample }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'SFMono-Regular',Consolas,monospace;font-size:11.5px;color:#1788BE;margin-top:6px;line-height:1.4;word-break:break-word;\">{{ el.example }}<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noRefMatches }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:#9FA8A9;padding:10px 0;\">No elements match “{{ refSearch }}”.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noActiveDict }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px dashed #C9D2D2;border-radius:12px;padding:20px;background:#fff;\">\n          <div style=\"font-size:14px;color:#012D3F;font-weight:500;margin-bottom:6px;\">No grammar loaded<\u002Fdiv>\n          <div style=\"font-size:13px;color:#747A7A;line-height:1.55;\">The dictionary for <span style=\"color:#012D3F;\">{{ activeGrammarName }}<\u002Fspan> hasn't been added yet. Drop its element list into <span style=\"font-family:monospace;\">data/grammars/<\u002Fspan> to enable generation and reference for this subtopic.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SETTINGS MODAL -->\n  <sc-if value=\"{{ showSettings }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onCloseSettings }}\" style=\"position:fixed;inset:0;background:rgba(1,45,63,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;\">\n      <div onclick=\"{{ stop }}\" style=\"background:#fff;border-radius:18px;width:520px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 16px 40px rgba(1,45,63,.3);\">\n        <div style=\"padding:22px 26px;border-bottom:1px solid #EEF1F1;display:flex;align-items:center;justify-content:space-between;\">\n          <span style=\"font-size:18px;font-weight:500;color:#012D3F;\">Settings<\u002Fspan>\n          <span onclick=\"{{ onCloseSettings }}\" style=\"font-size:18px;color:#9FA8A9;cursor:pointer;\">✕<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:24px 26px;\">\n          <div style=\"font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#747A7A;margin-bottom:10px;\">LLM provider<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-bottom:22px;\">\n            <button onclick=\"{{ onSetGemini }}\" style=\"{{ geminiTabStyle }}\">Gemini<\u002Fbutton>\n            <button onclick=\"{{ onSetClaude }}\" style=\"{{ claudeTabStyle }}\">Claude<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isGemini }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <label style=\"font-size:13px;color:#012D3F;font-weight:500;display:block;margin-bottom:6px;\">Gemini API key<\u002Flabel>\n              <input oninput=\"{{ onGeminiKey }}\" value=\"{{ settingsGeminiKey }}\" placeholder=\"AIza… (paste your Google AI Studio key)\" style=\"width:100%;border:1px solid #C9D2D2;border-radius:9px;padding:11px 13px;font-size:14px;color:#012D3F;margin-bottom:16px;font-family:'SFMono-Regular',Consolas,monospace;\">\n              <label style=\"font-size:13px;color:#012D3F;font-weight:500;display:block;margin-bottom:6px;\">Model<\u002Flabel>\n              <input oninput=\"{{ onGeminiModel }}\" value=\"{{ settingsGeminiModel }}\" style=\"width:100%;border:1px solid #C9D2D2;border-radius:9px;padding:11px 13px;font-size:14px;color:#012D3F;font-family:'SFMono-Regular',Consolas,monospace;\">\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isClaude }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <label style=\"font-size:13px;color:#012D3F;font-weight:500;display:block;margin-bottom:6px;\">Claude API key<\u002Flabel>\n              <input oninput=\"{{ onClaudeKey }}\" value=\"{{ settingsClaudeKey }}\" placeholder=\"sk-ant-… (paste your Anthropic key)\" style=\"width:100%;border:1px solid #C9D2D2;border-radius:9px;padding:11px 13px;font-size:14px;color:#012D3F;margin-bottom:16px;font-family:'SFMono-Regular',Consolas,monospace;\">\n              <label style=\"font-size:13px;color:#012D3F;font-weight:500;display:block;margin-bottom:6px;\">Model<\u002Flabel>\n              <input oninput=\"{{ onClaudeModel }}\" value=\"{{ settingsClaudeModel }}\" style=\"width:100%;border:1px solid #C9D2D2;border-radius:9px;padding:11px 13px;font-size:14px;color:#012D3F;font-family:'SFMono-Regular',Consolas,monospace;\">\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"background:#F4F6F6;border-radius:10px;padding:13px 15px;margin-top:18px;font-size:12.5px;color:#747A7A;line-height:1.55;\">If a shared key is built into this deployment you can leave this blank — it is used automatically. Anything you enter here overrides it for this browser only (stored in localStorage) and is sent directly to the provider.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 26px;border-top:1px solid #EEF1F1;display:flex;justify-content:flex-end;gap:10px;\">\n          <button onclick=\"{{ onCloseSettings }}\" style=\"background:#fff;color:#012D3F;border:1px solid #C9D2D2;border-radius:9px;height:40px;padding:0 18px;font-size:14px;font-family:inherit;cursor:pointer;\">Close<\u002Fbutton>\n          <button onclick=\"{{ onSaveSettings }}\" style=\"background:#06A74E;color:#fff;border:none;border-radius:9px;height:40px;padding:0 20px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;\">Save<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:860}}\">\nclass Component extends DCLogic {\n  STOP = new Set(\"the a an of to in for and or is are be it on if as at by no not all any its per with from value values enter use used using this that you can could also into within only must may which what where when number numbers list element elements example examples string numeric date arg apply applies positioned multiply returns return whose than above below greater less equal\".split(\" \"));\n  CAT_ORDER = [\"function\",\"deal characteristic\",\"node characteristic\",\"LiquidityDimensions\",\"operator\",\"constant\",\"list\"];\n  CAT_LABEL = {\"function\":\"Functions\",\"deal characteristic\":\"Deal characteristics\",\"node characteristic\":\"Node characteristics\",\"LiquidityDimensions\":\"Liquidity dimensions\",\"operator\":\"Operators\",\"constant\":\"Constants\",\"list\":\"Lists\"};\n  RESERVED = new Set([\"and\",\"or\",\"not\",\"in\",\"like\",\"true\",\"false\",\"null\",\"is\",\"between\",\"abs\",\"min\",\"max\",\"tenor\",\"rd\",\"calc_date\",\"previous\",\"result\",\"d\",\"m\",\"y\",\"loan\",\"deposit\",\"facility\",\"bond\",\"swap\",\"capfloor\",\"deal\",\"position\",\"tranche\",\"issuer\",\"ctrpty\",\"agency\",\"long\",\"short\",\"fixed\",\"floating\"]);\n  SAMPLE = {\n    grammarType:\"DealSelectionExpression\", isSample:true,\n    formula:'loan.rate_type = \"FIXED\"\\nAND loan.nominal > 1M\\nAND loan.maturity_date <= RD + tenor(d:0,m:0,y:1)',\n    explanation:\"Filters the population to fixed-rate loans with a nominal above one million, maturing within one year of the reporting date (RD). tenor(d:0,m:0,y:1) adds exactly one year.\",\n    elementsUsed:[{element:\"rate_type\",category:\"deal characteristic\"},{element:\"nominal\",category:\"deal characteristic\"},{element:\"maturity_date\",category:\"deal characteristic\"},{element:\"RD\",category:\"constant\"},{element:\"tenor()\",category:\"function\"}],\n    valid:true, issues:[]\n  };\n  EXAMPLES = [\n    \"Select all fixed-rate loans with a nominal above 1 million that mature within the next year.\",\n    \"Deposits where the interest rate is greater than 1.4%.\",\n    \"Facilities whose used amount is more than half of the available amount.\",\n    \"Level 2a HQLA assets with a central bank haircut above 5%.\"\n  ];\n\n  state = {\n    loaded:false, dict:{}, vocab:{}, types:[], typeNames:[], profiles:{}, idf:{}, ask:\"\", pinned:null, autoDetect:true,\n    loading:false, error:null, result:null, history:[], activeHistoryId:null,\n    refSearch:\"\", copied:false, showSettings:false,\n    settings:{ provider:\"gemini\", geminiKey:\"\", geminiModel:\"gemini-2.0-flash\", claudeKey:\"\", claudeModel:\"claude-sonnet-4-20250514\" }\n  };\n\n  componentDidMount(){\n    try{ const s=localStorage.getItem(\"gw_settings\"); if(s) this.setState({settings:{...this.state.settings, ...JSON.parse(s)}}); }catch(e){}\n    try{ const h=localStorage.getItem(\"gw_history\"); if(h) this.setState({history:JSON.parse(h)}); }catch(e){}\n    this.loadData(0);\n  }\n\n  ingest(rows, typesJson){\n    const dict={};\n    rows.forEach(r=>{ const g=r.grammarType||\"DealSelectionExpression\"; (dict[g]=dict[g]||[]).push(r); });\n    const vocab={};\n    Object.keys(dict).forEach(g=>{ vocab[g]=this.buildVocab(dict[g]); });\n    let types = Array.isArray(typesJson) && typesJson.length ? typesJson.slice() : Object.keys(dict).sort().map(name=>({name,label:name,count:dict[name].length}));\n    types = types.filter(t=>dict[t.name]);\n    const typeNames=types.map(t=>t.name);\n    const {profiles, idf}=this.buildProfiles(dict, types);\n    this.setState({dict, vocab, types, typeNames, profiles, idf, loaded:true});\n  }\n\n  loadData(tries){\n    // 1) embedded data (standalone / offline build)\n    if(window.GW_DICTIONARY && Array.isArray(window.GW_DICTIONARY)){ this.ingest(window.GW_DICTIONARY, window.GW_TYPES); return; }\n    // 2) fetch from data/ (when served over http)\n    Promise.all([\n      fetch(\"data/grammar_dictionary.json\").then(r=>r.json()),\n      fetch(\"data/grammar_types.json\").then(r=>r.json()).catch(()=>null)\n    ]).then(([rows, typesJson])=>{ this.ingest(rows, typesJson); })\n    .catch(err=>{\n      if(window.GW_DICTIONARY){ this.ingest(window.GW_DICTIONARY, window.GW_TYPES); return; }\n      if((tries||0)<20){ setTimeout(()=>this.loadData((tries||0)+1), 120); return; }\n      this.setState({loaded:true, error:\"Could not load grammar dictionary: \"+(err&&err.message||err)});\n    });\n  }\n\n  buildVocab(rows){\n    const v=new Set();\n    rows.forEach(r=>{\n      const blob=(r.element||\"\")+\" \"+(r.example||\"\");\n      const toks=blob.split(/[^A-Za-z0-9_]+/);\n      toks.forEach(t=>{ if(t && t.length>1 && /[A-Za-z]/.test(t)) v.add(t.toLowerCase()); });\n    });\n    return v;\n  }\n\n  BOOST = {\n    \"fx\":\"FXSelectionExpression\",\"ecl\":\"Expected Credit Loss Formula\",\"expected credit loss\":\"Expected Credit Loss Formula\",\n    \"lgd\":\"Loss Given Default Formula\",\"loss given default\":\"Loss Given Default Formula\",\n    \"ead\":\"Exposure At Default Formula\",\"exposure at default\":\"Exposure At Default Formula\",\n    \"ftp\":\"FTP Formula\",\"funds transfer pricing\":\"FTP Formula\",\"prepayment\":\"Behavior Model\",\"behavior\":\"Behavior Model\",\"behaviour\":\"Behavior Model\",\n    \"volatility\":\"Volatility Perimeter\",\"spread\":\"MktSpreadFormula\",\"market spread\":\"MktSpreadFormula\",\n    \"loan\":\"DealSelectionExpression\",\"deposit\":\"DealSelectionExpression\",\"deal\":\"DealSelectionExpression\",\"facility\":\"DealSelectionExpression\",\n    \"regulatory weight\":\"RegulatoryWeightSelectionExpression\",\"risk weight\":\"RegulatoryWeightSelectionExpression\",\n    \"economic index\":\"Economic Index Formula\",\"balance sheet\":\"BalanceSheetStrategy\",\"limit\":\"Limit Formula\",\"custom dimension\":\"Custom Dimension\"\n  };\n  stem(w){ if(w.length>4 && /ies$/.test(w)) return w.slice(0,-3)+\"y\"; if(w.length>3 && /[^s]s$/.test(w)) return w.slice(0,-1); return w; }\n  tokenize(text){\n    return (text||\"\").toLowerCase().split(/[^a-z0-9_]+/).filter(w=>w && w.length>=2 && !this.STOP.has(w) && /[a-z]/.test(w)).map(w=>this.stem(w));\n  }\n  buildProfiles(dict, types){\n    const profiles={}, df={};\n    types.forEach(t=>{\n      const set=new Set();\n      const nameWords=(t.name+\" \"+(t.label||\"\")).replace(/([a-z0-9])([A-Z])/g,\"$1 $2\").replace(/([A-Z]+)([A-Z][a-z])/g,\"$1 $2\");\n      this.tokenize(nameWords).forEach(w=>set.add(w));\n      (dict[t.name]||[]).forEach(r=>{\n        (r.element||\"\").toLowerCase().split(/[^a-z0-9_]+/).forEach(w=>{ if(w && w.length>=2 && /[a-z]/.test(w) && !this.STOP.has(w)) set.add(this.stem(w)); });\n      });\n      profiles[t.name]=set;\n      set.forEach(w=>{ df[w]=(df[w]||0)+1; });\n    });\n    const N=types.length||1, idf={};\n    Object.keys(df).forEach(w=>{ idf[w]=Math.log((N+1)/(df[w]+0.5)); });\n    return {profiles, idf};\n  }\n  detect(ask){\n    if(!(ask||\"\").trim()) return {type:null, confidence:0};\n    const profiles=this.state.profiles||{}, idf=this.state.idf||{};\n    const names=Object.keys(profiles);\n    if(!names.length) return {type:(this.state.typeNames[0]||\"DealSelectionExpression\"), confidence:0, guess:true};\n    const toks=this.tokenize(ask), seen=new Set(), scores={};\n    let total=0;\n    toks.forEach(w=>{ if(seen.has(w))return; seen.add(w); const wt=idf[w]||0; if(wt<=0)return; names.forEach(n=>{ if(profiles[n].has(w)){ scores[n]=(scores[n]||0)+wt; total+=wt; } }); });\n    const low=(ask||\"\").toLowerCase();\n    Object.keys(this.BOOST).forEach(k=>{ const tgt=this.BOOST[k]; if(tgt && profiles[tgt] && low.indexOf(k)>=0){ scores[tgt]=(scores[tgt]||0)+2.4; total+=2.4; } });\n    let best=null,bestScore=0;\n    names.forEach(n=>{ const s=scores[n]||0; if(s>bestScore){bestScore=s;best=n;} });\n    if(!best||bestScore<=0) return {type:(this.state.typeNames[0]||\"DealSelectionExpression\"), confidence:0, guess:true};\n    const share=total>0?bestScore/total:0;\n    return {type:best, confidence:Math.max(35, Math.min(98, Math.round(40+share*60)))};\n  }\n\n  activeGrammar(){ return this.state.pinned || (this.detect(this.state.ask).type) || (this.state.dict[\"DealSelectionExpression\"]?\"DealSelectionExpression\":this.state.typeNames[0]) || \"DealSelectionExpression\"; }\n  cfg(){ return window.GW_CONFIG || {}; }\n  isValidKey(k){ return !!k && k.trim().length>15 && !/^(your_|paste|__)/i.test(k.trim()); }\n  effKey(provider){\n    const s=this.state.settings;\n    if(provider===\"claude\"){ return this.isValidKey(s.claudeKey) ? s.claudeKey.trim() : ((this.cfg().claudeKey||\"\").trim()); }\n    return this.isValidKey(s.geminiKey) ? s.geminiKey.trim() : ((this.cfg().geminiKey||\"\").trim());\n  }\n  effModel(provider){\n    const s=this.state.settings;\n    if(provider===\"claude\") return (s.claudeModel||this.cfg().claudeModel||\"claude-sonnet-4-20250514\");\n    return (s.geminiModel||this.cfg().geminiModel||\"gemini-2.0-flash\");\n  }\n  keyValid(){ return this.isValidKey(this.effKey(this.state.settings.provider)); }\n\n  buildPrompt(grammarType, ask, rows){\n    const lines = rows.map(r=>{\n      const desc=(r.description||\"\").replace(/\\s+/g,\" \").slice(0,150);\n      const ex=(r.example||\"\").replace(/\\s+/g,\" \").slice(0,90);\n      return `- [${r.dataType} · ${r.category}] ${r.element} — ${desc}${ex?` — e.g. ${ex}`:\"\"}`;\n    }).join(\"\\n\");\n    return `You are Grammar Writer, an expert in Regnology regulatory expression grammars.\nConvert the user's plain-language requirement into a SINGLE valid ${grammarType} expression.\nUse ONLY the elements, operators, functions, constants and syntax that appear in the grammar reference below. Match the exact element names and the example syntax. Do not invent fields. If the requirement is ambiguous, choose the most standard interpretation.\n\nGRAMMAR: ${grammarType}\nELEMENTS (format: [dataType · category] element — description — e.g. example):\n${lines}\n\nREQUIREMENT:\n\"\"\"${ask}\"\"\"\n\nRespond with ONLY a JSON object (no markdown fences) with exactly these keys:\n{\"formula\": \"the expression; use newlines for readability\",\"explanation\":\"1-3 plain-English sentences\",\"elementsUsed\":[{\"element\":\"name\",\"category\":\"category\"}],\"valid\":true,\"issues\":[\"any grammar rule the formula bends; empty array if none\"]}`;\n  }\n\n  async callLLM(prompt){\n    const s=this.state.settings;\n    if(s.provider===\"gemini\"){\n      const url=`/api/gemini?model=${encodeURIComponent(this.effModel(\"gemini\"))}`;\n      const res=await fetch(url,{method:\"POST\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:\"application/json\"}})});\n      if(!res.ok){ const tx=await res.text(); throw new Error(\"Gemini \"+res.status+\": \"+tx.slice(0,180)); }\n      const data=await res.json();\n      return (data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts||[]).map(p=>p.text||\"\").join(\"\");\n    } else {\n      const res=await fetch(\"https://api.anthropic.com/v1/messages\",{method:\"POST\",headers:{\"content-type\":\"application/json\",\"x-api-key\":this.effKey(\"claude\"),\"anthropic-version\":\"2023-06-01\",\"anthropic-dangerous-direct-browser-access\":\"true\"},body:JSON.stringify({model:this.effModel(\"claude\"),max_tokens:1200,messages:[{role:\"user\",content:prompt}]})});\n      if(!res.ok){ const tx=await res.text(); throw new Error(\"Claude \"+res.status+\": \"+tx.slice(0,180)); }\n      const data=await res.json();\n      return (data.content||[]).map(c=>c.text||\"\").join(\"\");\n    }\n  }\n\n  parseJSON(text){\n    let t=(text||\"\").trim();\n    t=t.replace(/^```(json)?/i,\"\").replace(/```$/,\"\").trim();\n    try{ return JSON.parse(t); }catch(e){}\n    const m=t.match(/\\{[\\s\\S]*\\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }\n    throw new Error(\"The model did not return valid JSON.\");\n  }\n\n  lint(formula, grammarType){\n    const vocab=this.state.vocab[grammarType];\n    if(!vocab) return {unknown:[]};\n    const ids=(formula||\"\").match(/[A-Za-z_][A-Za-z0-9_.]*/g)||[];\n    const unknown=[]; const seen=new Set();\n    ids.forEach(id=>{\n      id.split(\".\").forEach(part=>{\n        const p=part.toLowerCase();\n        if(!p || p.length<2 || /^\\d+$/.test(p)) return;\n        if(this.RESERVED.has(p)) return;\n        if(vocab.has(p)) return;\n        if(seen.has(p)) return;\n        seen.add(p); unknown.push(part);\n      });\n    });\n    return {unknown:unknown.slice(0,8)};\n  }\n\n  async generate(){\n    const ask=this.state.ask.trim();\n    if(!ask){ return; }\n    const g=this.activeGrammar();\n    const rows=this.state.dict[g];\n    if(!rows){ this.setState({error:\"No grammar dictionary is loaded for \"+g+\". Add it to enable generation.\", result:null}); return; }\n    if(!this.keyValid()){ this.setState({result:{needsKey:true}, error:null}); return; }\n    this.setState({loading:true, error:null, result:null, activeHistoryId:null});\n    try{\n      const prompt=this.buildPrompt(g, ask, rows);\n      const raw=await this.callLLM(prompt);\n      const obj=this.parseJSON(raw);\n      const formula=(obj.formula||\"\").trim();\n      const lintRes=this.lint(formula, g);\n      const result={\n        grammarType:g, formula,\n        explanation:obj.explanation||\"\",\n        elementsUsed:Array.isArray(obj.elementsUsed)?obj.elementsUsed:[],\n        valid: obj.valid!==false && lintRes.unknown.length===0,\n        llmIssues: Array.isArray(obj.issues)?obj.issues:[],\n        unknown: lintRes.unknown, isSample:false\n      };\n      const item={ id:\"h\"+Date.now(), ask, grammarType:g, ts:Date.now(), result };\n      const history=[item, ...this.state.history].slice(0,50);\n      try{ localStorage.setItem(\"gw_history\", JSON.stringify(history)); }catch(e){}\n      this.setState({loading:false, result, history, activeHistoryId:item.id});\n    }catch(err){\n      this.setState({loading:false, error:err.message||String(err), result:null});\n    }\n  }\n\n  saveSettings(){\n    try{ localStorage.setItem(\"gw_settings\", JSON.stringify(this.state.settings)); }catch(e){}\n    this.setState({showSettings:false});\n  }\n  setSetting(k,v){ this.setState({settings:{...this.state.settings,[k]:v}}); }\n\n  copy(){\n    const f=this.state.result&&this.state.result.formula; if(!f) return;\n    const done=()=>{ this.setState({copied:true}); setTimeout(()=>this.setState({copied:false}),1500); };\n    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(f).then(done).catch(done); } else { done(); }\n  }\n  copyRef(text){ if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{}); }\n\n  pickHistory(item){ this.setState({result:item.result, ask:item.ask, pinned:item.grammarType, activeHistoryId:item.id, error:null, autoDetect:false}); }\n  deleteHistory(id,e){ if(e&&e.stopPropagation)e.stopPropagation(); const history=this.state.history.filter(h=>h.id!==id); try{localStorage.setItem(\"gw_history\",JSON.stringify(history));}catch(x){} this.setState({history}); }\n  clearHistory(){ try{localStorage.removeItem(\"gw_history\");}catch(e){} this.setState({history:[]}); }\n\n  renderVals(){\n    const st=this.state;\n    const det=this.detect(st.ask);\n    const active=this.activeGrammar();\n    const hasDict=!!st.dict[active];\n    const dictRows=st.dict[active]||[];\n    const keyOk=this.keyValid();\n    const r=st.result;\n    const hasResult=!!(r && !r.needsKey);\n    const needsKey=!!(r && r.needsKey);\n    const provName = st.settings.provider===\"gemini\" ? \"Gemini\" : \"Claude\";\n\n    // grammar tags\n    const grammarTags=(st.types.length?st.types:[]).map(t=>{\n      const name=t.name;\n      const isActive = name===active;\n      const isPinned = st.pinned===name;\n      const isDetected = !st.pinned && det.type===name && !!st.ask.trim();\n      const base=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border-radius:8px;font-size:13px;cursor:pointer;line-height:1.3;\";\n      const style = isActive\n        ? base+\"background:#fff;border:1px solid #06A74E;color:#012D3F;font-weight:500;\"\n        : base+\"border:1px solid transparent;color:#3a4444;\";\n      return { name, style, title:t.label||name, showAuto:isDetected, showPinned:isPinned,\n        confLabel: isDetected? det.confidence+\"%\" : \"\",\n        onClick:()=>{ this.setState({pinned:name, autoDetect:false}); } };\n    });\n\n    // history\n    const fmtTime=(ts)=>{ const d=(Date.now()-ts)/1000; if(d<60)return\"just now\"; if(d<3600)return Math.floor(d/60)+\"m ago\"; if(d<86400)return Math.floor(d/3600)+\"h ago\"; return Math.floor(d/86400)+\"d ago\"; };\n    const historyList=st.history.map(h=>{\n      const isAct=h.id===st.activeHistoryId;\n      const base=\"border-radius:10px;padding:10px 12px;cursor:pointer;\";\n      const style=isAct? base+\"background:#fff;border:1px solid #06A74E;\":base+\"border:1px solid transparent;\";\n      return { ask:h.ask, meta:h.grammarType+\" · \"+fmtTime(h.ts), style, onClick:()=>this.pickHistory(h), onDelete:(e)=>this.deleteHistory(h.id,e) };\n    });\n\n    // reference groups (filtered)\n    const q=st.refSearch.trim().toLowerCase();\n    const byCat={};\n    dictRows.forEach(row=>{\n      if(q){ const hay=((row.element||\"\")+\" \"+(row.description||\"\")+\" \"+(row.example||\"\")).toLowerCase(); if(!hay.includes(q)) return; }\n      (byCat[row.category]=byCat[row.category]||[]).push(row);\n    });\n    const orderedCats=[...this.CAT_ORDER.filter(c=>byCat[c]), ...Object.keys(byCat).filter(c=>this.CAT_ORDER.indexOf(c)<0)];\n    const referenceGroups=orderedCats.map(cat=>({\n      label:this.CAT_LABEL[cat]||cat, count:byCat[cat].length,\n      items:byCat[cat].slice(0,q?60:40).map(row=>({\n        element:row.element, description:(row.description||\"\").slice(0,160),\n        example:row.example, hasExample:!!row.example,\n        onClick:()=>this.copyRef(row.element)\n      }))\n    }));\n    const noRefMatches = hasDict && q && referenceGroups.length===0;\n\n    // validation display\n    let validation={boxStyle:\"display:none;\"};\n    if(hasResult){\n      const ok=r.valid && (!r.llmIssues||r.llmIssues.length===0) && (!r.unknown||r.unknown.length===0);\n      if(ok){\n        validation={\n          boxStyle:\"display:flex;align-items:flex-start;gap:11px;background:#E7F6ee;border:1px solid #b6e3c9;border-radius:12px;padding:13px 16px;margin-top:16px;\",\n          iconStyle:\"width:20px;height:20px;border-radius:50%;background:#06A74E;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;\",\n          icon:\"✓\", titleStyle:\"font-size:13.5px;color:#0a6b39;font-weight:500;\",\n          title:\"Valid — follows the \"+r.grammarType+\" grammar.\",\n          hasDetail:false, hasUnknown:false, hasIssues:false, unknown:[], issues:[]\n        };\n      } else {\n        const unknown=(r.unknown||[]).map(t=>({token:t}));\n        const issues=(r.llmIssues||[]).map(t=>({text:t}));\n        validation={\n          boxStyle:\"display:flex;align-items:flex-start;gap:11px;background:#FCF3E2;border:1px solid #f0d8a8;border-radius:12px;padding:13px 16px;margin-top:16px;\",\n          iconStyle:\"width:20px;height:20px;border-radius:50%;background:#EC9D1C;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;\",\n          icon:\"!\", titleStyle:\"font-size:13.5px;color:#8a5a08;font-weight:500;\",\n          title:\"Review before use — possible grammar issues.\",\n          hasDetail: unknown.length>0,\n          detail: unknown.length>0 ? \"These tokens were not found in the \"+r.grammarType+\" dictionary:\" : \"\",\n          hasUnknown:unknown.length>0, unknown,\n          hasIssues:issues.length>0, issues\n        };\n      }\n    }\n\n    const s=st.settings;\n    const tabBase=\"border:none;border-radius:9px;height:38px;padding:0 20px;font-size:14px;font-family:inherit;cursor:pointer;\";\n    const examples=this.EXAMPLES.map(text=>({text, onClick:()=>this.setState({ask:text, pinned:null, autoDetect:true})}));\n\n    return {\n      loaded:st.loaded,\n      ask:st.ask,\n      onAskInput:(e)=>this.setState({ask:e.target.value, activeHistoryId:null}),\n      activeGrammarName:active,\n      detectedSuffix: st.pinned? \"· pinned\" : (det.type? \"· \"+det.confidence+\"% match\":\"\"),\n      showDetected: !!st.ask.trim() || !!st.pinned,\n      autoResetLabel: st.pinned? \"Auto-detect\" : \"Auto\",\n      onResetAuto:()=>this.setState({pinned:null, autoDetect:true}),\n\n      grammarTags,\n      historyList, hasHistory:st.history.length>0, noHistory:st.history.length===0,\n      onClearHistory:()=>this.clearHistory(),\n\n      // generate button\n      generateLabel: st.loading? \"Generating…\" : \"Generate\",\n      generateStyle: \"background:\"+(st.loading?\"#7cc79b\":\"#06A74E\")+\";color:#fff;border:none;border-radius:10px;height:44px;padding:0 26px;font-size:15px;font-weight:500;font-family:inherit;cursor:\"+(st.loading?\"default\":\"pointer\")+\";\",\n      onGenerate:()=>{ if(!st.loading) this.generate(); },\n\n      // states\n      isLoading:st.loading,\n      hasError:!!st.error, errorMsg:st.error||\"\",\n      needsKey, providerName:provName,\n      hasResult,\n      isEmpty: !st.loading && !hasResult && !needsKey && !st.error,\n      examples,\n\n      // result\n      result: r || {},\n      copyLabel: st.copied? \"Copied\" : \"Copy\",\n      onCopy:()=>this.copy(),\n      elementsUsed: (r&&r.elementsUsed)||[],\n      hasElementsUsed: !!(r&&r.elementsUsed&&r.elementsUsed.length),\n      validation,\n      onLoadSample:()=>this.setState({result:{...this.SAMPLE}, error:null, activeHistoryId:null}),\n\n      // reference\n      hasActiveDict:hasDict, noActiveDict:!hasDict,\n      refCountLabel: hasDict? dictRows.length+\" elements\" : \"no grammar loaded\",\n      refSearch:st.refSearch,\n      onRefSearch:(e)=>this.setState({refSearch:e.target.value}),\n      referenceGroups, noRefMatches,\n\n      // top bar\n      providerStatus: keyOk? provName+\" connected\" : provName+\" — add key\",\n      providerDotColor: keyOk? \"#3CE55A\" : \"#EC9D1C\",\n      onOpenSettings:()=>this.setState({showSettings:true}),\n\n      // settings\n      showSettings:st.showSettings,\n      onCloseSettings:()=>this.setState({showSettings:false}),\n      onSaveSettings:()=>this.saveSettings(),\n      stop:(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); },\n      isGemini: s.provider===\"gemini\", isClaude: s.provider===\"claude\",\n      onSetGemini:()=>this.setSetting(\"provider\",\"gemini\"),\n      onSetClaude:()=>this.setSetting(\"provider\",\"claude\"),\n      geminiTabStyle: tabBase+(s.provider===\"gemini\"?\"background:#06A74E;color:#fff;\":\"background:#F4F6F6;color:#3a4444;\"),\n      claudeTabStyle: tabBase+(s.provider===\"claude\"?\"background:#06A74E;color:#fff;\":\"background:#F4F6F6;color:#3a4444;\"),\n      settingsGeminiKey:s.geminiKey, settingsGeminiModel:s.geminiModel,\n      settingsClaudeKey:s.claudeKey, settingsClaudeModel:s.claudeModel,\n      onGeminiKey:(e)=>this.setSetting(\"geminiKey\",e.target.value),\n      onGeminiModel:(e)=>this.setSetting(\"geminiModel\",e.target.value),\n      onClaudeKey:(e)=>this.setSetting(\"claudeKey\",e.target.value),\n      onClaudeModel:(e)=>this.setSetting(\"claudeModel\",e.target.value)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
