<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCO Auto Login - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.8s ease;
        }

        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .script-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .script-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .script-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .script-card p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .run-both-section {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 15px;
            margin-bottom: 40px;
        }

        .run-both-section h2 {
            color: #d63031;
            margin-bottom: 15px;
        }

        .run-both-section p {
            color: #666;
            margin-bottom: 20px;
        }

        .status-section {
            margin-top: 40px;
        }

        .status-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }

        .status-card h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-not-started {
            background: #e0e0e0;
            color: #666;
        }

        .status-running {
            background: #4fc3f7;
            color: white;
            animation: pulse 1.5s infinite;
        }

        .status-completed {
            background: #66bb6a;
            color: white;
        }

        .status-failed {
            background: #ef5350;
            color: white;
        }

        .status-error {
            background: #ff9800;
            color: white;
        }

        .status-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }

        .status-details p {
            margin: 5px 0;
        }

        .output-section {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            animation: fadeInDown 0.5s ease;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .main-content {
                padding: 20px;
            }

            .scripts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 RCO Auto Login Control Panel</h1>
            <p>Automated script execution for Ralex and RCO systems</p>
        </div>

        <div class="main-content">
            <div id="alertContainer"></div>

            <!-- Run Both Scripts Section -->
            <div class="run-both-section">
                <h2>⚡ Quick Execute</h2>
                <p>Run both scripts sequentially with one click</p>
                <button class="btn btn-success" onclick="runBothScripts()" id="btnRunBoth">
                    Run Both Scripts
                </button>
            </div>

            <!-- Individual Scripts -->
            <div class="scripts-grid" id="scriptsGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading scripts...</p>
                </div>
            </div>

            <!-- Status Section -->
            <div class="status-section">
                <h2>📊 Execution Status</h2>
                <div class="status-cards" id="statusCards">
                    <div class="loading">
                        <p>Status information will appear here...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>RCO Auto Login System | © 2025</p>
        </div>
    </div>

    <script>
        let scripts = {};
        let statusInterval = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadScripts();
            startStatusPolling();
        });

        // Load available scripts
        async function loadScripts() {
            try {
                const response = await fetch('/api/scripts');
                const data = await response.json();
                
                if (data.success) {
                    scripts = data.scripts;
                    renderScripts();
                    updateStatus();
                }
            } catch (error) {
                showAlert('Failed to load scripts: ' + error.message, 'error');
            }
        }

        // Render script cards
        function renderScripts() {
            const grid = document.getElementById('scriptsGrid');
            grid.innerHTML = '';

            for (const [key, script] of Object.entries(scripts)) {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <h3>${script.name}</h3>
                    <p>${script.description}</p>
                    <button class="btn btn-primary" onclick="runScript('${key}')" id="btn-${key}">
                        Run Script
                    </button>
                `;
                grid.appendChild(card);
            }
        }

        // Run a single script
        async function runScript(scriptKey) {
            const button = document.getElementById(`btn-${scriptKey}`);
            button.disabled = true;
            button.textContent = 'Starting...';

            try {
                const response = await fetch(`/api/run/${scriptKey}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    showAlert(`✓ ${data.message}`, 'success');
                } else {
                    showAlert(`✗ ${data.error}`, 'error');
                    button.disabled = false;
                    button.textContent = 'Run Script';
                }
            } catch (error) {
                showAlert(`✗ Failed to start script: ${error.message}`, 'error');
                button.disabled = false;
                button.textContent = 'Run Script';
            }
        }

        // Run both scripts
        async function runBothScripts() {
            const button = document.getElementById('btnRunBoth');
            button.disabled = true;
            button.textContent = 'Starting Both Scripts...';

            // Disable individual buttons
            for (const key of Object.keys(scripts)) {
                const btn = document.getElementById(`btn-${key}`);
                if (btn) btn.disabled = true;
            }

            try {
                const response = await fetch('/api/run/both', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    showAlert(`✓ ${data.message}`, 'success');
                } else {
                    showAlert(`✗ Failed to start scripts`, 'error');
                }
            } catch (error) {
                showAlert(`✗ Failed to start scripts: ${error.message}`, 'error');
                button.disabled = false;
                button.textContent = 'Run Both Scripts';
            }
        }

        // Update status display
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.success) {
                    renderStatus(data.status);
                    updateButtons(data.status);
                }
            } catch (error) {
                console.error('Failed to update status:', error);
            }
        }

        // Render status cards
        function renderStatus(statusData) {
            const container = document.getElementById('statusCards');
            container.innerHTML = '';

            for (const [key, status] of Object.entries(statusData)) {
                const script = scripts[key];
                if (!script) continue;

                const card = document.createElement('div');
                card.className = 'status-card';
                
                let statusClass = 'status-not-started';
                let statusText = 'Not Started';
                
                if (status.status === 'running') {
                    statusClass = 'status-running';
                    statusText = '⚡ Running...';
                } else if (status.status === 'completed') {
                    statusClass = 'status-completed';
                    statusText = '✓ Completed';
                } else if (status.status === 'failed') {
                    statusClass = 'status-failed';
                    statusText = '✗ Failed';
                } else if (status.status === 'error') {
                    statusClass = 'status-error';
                    statusText = '⚠ Error';
                } else if (status.status === 'timeout') {
                    statusClass = 'status-error';
                    statusText = '⏱ Timeout';
                }

                let detailsHTML = '';
                if (status.start_time) {
                    detailsHTML += `
                        <div class="status-details">
                            <p><strong>Started:</strong> ${status.start_time}</p>
                            ${status.end_time ? `<p><strong>Ended:</strong> ${status.end_time}</p>` : ''}
                            ${status.error ? `<p><strong>Error:</strong> ${status.error}</p>` : ''}
                        </div>
                    `;
                }

                if (status.output && status.output.trim()) {
                    detailsHTML += `
                        <div class="output-section">
                            <strong>Output:</strong><br>
                            <pre>${escapeHtml(status.output)}</pre>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <h4>${script.name}</h4>
                    <span class="status-badge ${statusClass}">${statusText}</span>
                    ${detailsHTML}
                `;

                container.appendChild(card);
            }
        }

        // Update button states based on status
        function updateButtons(statusData) {
            let anyRunning = false;

            for (const [key, status] of Object.entries(statusData)) {
                const button = document.getElementById(`btn-${key}`);
                if (!button) continue;

                if (status.status === 'running') {
                    button.disabled = true;
                    button.textContent = 'Running...';
                    anyRunning = true;
                } else {
                    button.disabled = false;
                    button.textContent = 'Run Script';
                }
            }

            // Update "Run Both" button
            const btnRunBoth = document.getElementById('btnRunBoth');
            if (btnRunBoth) {
                if (anyRunning) {
                    btnRunBoth.disabled = true;
                    btnRunBoth.textContent = 'Scripts Running...';
                } else {
                    btnRunBoth.disabled = false;
                    btnRunBoth.textContent = 'Run Both Scripts';
                }
            }
        }

        // Start polling for status updates
        function startStatusPolling() {
            // Update immediately
            updateStatus();
            
            // Then update every 2 seconds
            statusInterval = setInterval(updateStatus, 2000);
        }

        // Show alert message
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            container.appendChild(alert);

            // Auto-remove after 5 seconds
            setTimeout(() => {
                alert.style.animation = 'fadeInDown 0.5s ease reverse';
                setTimeout(() => alert.remove(), 500);
            }, 5000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            if (statusInterval) {
                clearInterval(statusInterval);
            }
        });
    </script>
</body>
</html>
