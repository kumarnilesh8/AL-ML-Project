schema_version: "1.0"
id: onboard-external-agent-to-pack
name: Onboard an External Agent into the Pack
purpose: >
  Guide a team member through bringing an agent that was built outside the framework — in any
  tool or format — into the Regnology doctrine pack as typed YAML artifacts. The source agent
  might be a set of Cursor rules, a system prompt, a no-code bot, a framework script
  (LangChain, CrewAI, AutoGen), a custom GPT, or an assistant described only in a Confluence
  page or Markdown document; the procedure treats them all the same way. It first ensures the
  agent is fully understood — interviewing the owner (who may not be technical) and gathering
  all supporting documentation — then decomposes the agent's embedded knowledge into the
  correct artifact kinds (directive, tactic, procedure, paradigm, styleguide, toolguide,
  template (templates are filesystem artifacts, not DRG nodes), and optionally an agent
  profile), registers them in the DRG, tags them to a domain, and validates the result.
  Intended audience: anyone who has a working agent built outside the pack and wants it
  governed and shareable. This is distinct from migrate-doctrine-to-pack, which converts
  legacy Markdown doctrine; this procedure starts from an agent that was authored from
  scratch, not from an existing doctrine/ tree.
entry_condition: >
  An agent exists outside the pack — in any format, for example Cursor rules, a prompt, a
  no-code bot, a framework script, a custom GPT, or a written description in Confluence or
  Markdown — and its owner wants to bring its behaviour under governance. The owner can
  describe the agent's purpose and point to or provide its instructions, tools, documentation,
  and example behaviour; the owner does not need to be technical.
  spec-kitty is installed and spec-kitty doctrine pack validate pack/ runs without errors on
  the current pack/ content before any new work begins.
exit_condition: >
  spec-kitty doctrine pack validate pack/ reports 0 errors (0 advisories preferred; residual
  advisories require documented justification). Every artifact extracted from the source agent
  is written under the correct pack/ subdirectory and registered in drg/fragment.yaml with
  appropriate edges. The artifacts are tagged to a domain in config/artifact-tags.yaml (or the
  domain decision is explicitly deferred and recorded). If a dedicated agent profile was
  warranted it is created; if not, the decision not to create one is recorded. spec-kitty
  doctor doctrine reports the pack installed with the expected artifact counts.
  Templates are exempt from DRG registration; they must appear in the decomposition table
  and be referenced from at least one governed artifact.

steps:

  - title: Confirm baseline validation passes
    actor: agent
    description: >
      Before extracting anything, run the validation gate and record the result.

        spec-kitty doctrine pack validate pack/

      If errors exist, stop and fix them before proceeding. Adding new artifacts on top of a
      broken baseline compounds errors and obscures root cause. Record the baseline
      error/advisory counts in the work log.

  - title: Interview the agent owner and gather all source material and documentation
    actor: agent
    description: >
      Work with the agent's owner to understand what the agent is and gather the raw material.
      The owner may not be technical, so conduct the interview in plain language: ask what the
      agent is for, who uses it, what a good result looks like, and what it must never do.
      Where it helps, collaborate with other doctrine agents — Receptionist Rob can run the
      owner/audience interview, Analyst Annie can structure fuzzy or informal requirements
      into testable statements, and Synthesizer Sam can consolidate scattered documents into a
      single coherent picture.

      Do not assume; ask for the actual artifacts and ALL supporting documentation, in
      whatever form it exists. Request explicitly:

        - The owner's plain-language statement of what the agent is FOR and what it must
          never do.
        - Any written documentation about the agent: Markdown files (READMEs, design notes,
          AGENTS.md) AND Confluence pages. Ask for Confluence links or titles and retrieve
          them with the regnology-mcp confluence_* read tools (confluence_search,
          confluence_get_page, confluence_get_page_children).
        - The agent's defining instructions in whatever format it was built — a system prompt
          or persona definition, Cursor rules files (.cursor/rules/*.md, .mdc, AGENTS.md
          fragments), a no-code bot configuration, a framework script (LangChain / CrewAI /
          AutoGen), a custom GPT's instructions, etc.
        - Any embedded tool, API, or MCP configuration the agent depends on.
        - Example inputs and outputs (or transcripts) that show the agent's intended behaviour.

      Produce a short source inventory / dossier before decomposing anything, and confirm your
      understanding of the agent's purpose back to the owner before proceeding. If the owner
      only has a vague description and no documentation, elicit concrete behaviour with
      examples — a plausible-sounding description is not a specification.

  - title: Audit existing pack and built-in artifacts for overlap and connections
    actor: agent
    description: >
      Before classifying source material, inventory all registered artifact ids in the
      existing pack:

        # Inventory all registered artifact ids across all kinds:
        rg '^id:' pack/**/*.yaml                      # directives, tactics, procedures, paradigms, etc.
        rg '^profile-id:' pack/**/*.yaml              # agent profiles
        rg '^template:' pack/templates/**/*.md        # template front-matter slugs
        yq '.nodes[].id' pack/drg/fragment.yaml       # DRG-registered node ids (cross-check)

      Then surface the built-in spec-kitty catalog by running:

        spec-kitty doctrine pack validate pack/

      Any same_id_collision advisory indicates an artifact whose id collides with a
      spec-kitty built-in. Note: on a clean baseline with no new artifacts, the validator
      returns zero advisories — it does NOT proactively list all built-in ids. To discover
      built-ins, run validation after authoring candidate artifacts, or consult the spec-kitty
      charter built-in index if available.

      For each piece of knowledge identified during the interview, check whether a
      semantically similar artifact already exists in the pack or built-in catalog. If
      significant overlap is found:
        - Flag it explicitly to the owner: name the overlapping artifact and describe
          the overlap.
        - Propose augmenting the existing artifact (via an enhances edge or a content
          update) rather than creating a new one.
        - Only create a new artifact when the source agent's knowledge is genuinely
          distinct from anything already present.

      Significant overlap is flagged when ANY TWO of the following apply:
        1. Intent equivalence — same enforcement target (same "must never" / "always"
           behaviour) even if wording differs.
        2. Subset relationship — source fragment's rules are a strict subset of an
           existing artifact's scope.
        3. Id/title proximity — proposed id or title matches an existing id/title
           within Levenshtein distance ≤ 2.
        4. Keyword saturation — ≥ 60% of content-bearing tokens (nouns + verbs,
           stopwords removed) appear in an existing artifact's intent/purpose/summary.
        5. Owner tie-break — if exactly one criterion matches, the owner must choose
           augment vs. create-new in writing.

      Required output: record the audit outcome in the decomposition table using an
      "Overlap assessment" column:
        | Candidate id | Overlap assessment | Existing artifact (if any) | Decision (augment/new) | Rationale |

      For each piece of source knowledge, also scan existing artifacts for logical
      relationships — existing directives, procedures, or paradigms that the new
      artifacts should reference, apply, or require. Record these as candidate DRG
      edges; they will be added in the DRG registration step.

  - title: Decompose the agent's knowledge into candidate artifact kinds
    actor: agent
    description: >
      Prerequisite: the overlap audit from the previous step must be complete and
      its outcomes recorded in the decomposition table before beginning classification.
      Do not begin the decomposition table until the audit record exists.

      Read the source material and separate it into discrete pieces of knowledge. For each
      piece, classify it by the kind of pack artifact it should become. Apply these signals;
      a single source agent usually yields several artifacts of different kinds.

        Knowledge signal                                  → Pack artifact kind
        ───────────────────────────────────────────────────────────────────────────
        A non-negotiable rule or policy ("always", "never",
          "must")                                          → directive
        A reusable technique or how-to with ordered steps
          but no entry/exit gate                           → tactic
        A multi-step workflow WITH entry_condition,
          exit_condition, and named actors                 → procedure
        A mental model, philosophy, or design assumption   → paradigm
        A naming, formatting, or coding convention with
          good/bad examples                                → styleguide
        Knowledge about how to use a tool, platform, or MCP → toolguide
        A structured fill-in-the-blanks output format,
          reusable document scaffold, or blank form that
          practitioners use directly                         → template
        A Spec Kitty mission phase definition with entry/exit
          conditions and actor assignments                      → mission_step_contract
        A canonical term definition or terminology domain
          (not DRG-registered; lives in pack/glossary/<domain>/) → glossary
        The persona/identity wrapper itself (who the agent
          is, its routing, its boundaries)                 → agent_profile (see "Decide whether the agent needs a dedicated agent profile" step)
        Out of scope for classification: org-charter.yaml, META/ directory
          contents, .reviews/ artifacts — these are framework-managed.

      Where the line between a tactic and a procedure blurs, use the gate test: if the work
      has an explicit start condition, a definite "done" condition, and distinct actors,
      it is a procedure; otherwise it is a tactic. When a single block mixes a policy rule
      with the steps to satisfy it, split it: a directive for the rule and a tactic or
      procedure for the steps, linked by a DRG edge.

      Produce a decomposition table before writing any YAML:

        | Source fragment | Artifact kind | Proposed id | Target path |
        |---|---|---|---|
        | "Always cite the regulation" | directive | ... | directives/...directive.yaml |
        | "How to extract test cases"  | tactic    | ... | tactics/...tactic.yaml |

  - title: Author each artifact as typed YAML
    actor: agent
    description: >
      For each row in the decomposition table, create the YAML under pack/<kind>/ using the
      minimum required fields for that kind. Do not invent fields outside the schema. Preserve
      the concrete guidance, examples, and anti-patterns from the source agent; do not discard
      detail on the assumption it is obvious. Field requirements per kind:

        directive   — id (UPPER_SNAKE_CASE), title, intent, enforcement
                      (required|recommended|advisory), scope, procedures (min 1 step);
                      integrity_rules optional.
        tactic      — id (kebab-case), name, purpose, steps[].title, steps[].description;
                      failure_modes and notes optional.
        procedure   — id (kebab-case), name, purpose, entry_condition, exit_condition,
                      steps[].title, steps[].description; steps[].actor and anti_patterns
                      optional.
        paradigm    — id (kebab-case), name, summary (one-to-two sentence brief overview),
                      body (full detailed content; required alongside summary). Both summary
                      and body are required; a paradigm without body is incomplete.
        styleguide  — id (kebab-case), title, scope (code|docs|architecture|testing|
                      operations|glossary), principles (min 1); patterns/anti_patterns each
                      require both good_example and bad_example when present.
        toolguide   — id (kebab-case), tool (the tool name as a string), summary (prose),
                      guide_path (relative path to a companion .md file under
                      pack/toolguides/); the .md file must exist.
        template    — Markdown file under pack/templates/<domain>/<name>.md;
                      YAML front-matter block with keys: template, version, and
                      (if a companion styleguide exists) styleguide; pre-built
                      section structure with placeholder rows and inline HTML
                      comment guidance. Templates are NOT registered as DRG nodes.
                      If a companion styleguide exists, create the template alongside
                      it and reference the template in the styleguide's description.
                      The domain subdirectory should match the artifact's subject area
                      (e.g. pack/templates/writing/, pack/templates/architecture/).
                      New templates MUST include front-matter; legacy templates
                      without front-matter are grandfathered — do not retrofit
                      unless you are also creating a companion styleguide. The
                      `template` slug must match the filename stem in kebab-case.
                      When no companion styleguide exists, the template must be
                      referenced from at least one other governed artifact
                      (procedure description, tactic, or paradigm) to remain
                      discoverable.
                      Bidirectional linkage required: the companion styleguide's
                      description or principles[] must cite the template slug
                      (e.g. "companion template: meeting-minutes"); the template's
                      front-matter must cite the styleguide id (styleguide:
                      <id>). Add an acceptance check to the validation step.

      Cite related artifacts by their id, never by file path.

  - title: Check content-DRG consistency and flag external references
    actor: agent
    description: >
      For each newly authored artifact, scan all text fields (intent, scope, procedures,
      summary, principles, purpose, description, etc.) for:

      1. Cross-artifact references — any artifact id appearing in prose (UPPER_SNAKE_CASE
         for directives; kebab-case for all others). Every such reference must be backed
         by a DRG edge. If the edge is missing, add it now rather than deferring to the
         registration step. This keeps content and graph in sync as artifacts are written
         rather than discovering gaps at the end.

         Use word-boundary patterns to extract candidate tokens:
           rg -o '\b[A-Z][A-Z0-9_]{2,}\b' <file>           # directive ids (UPPER_SNAKE_CASE)
           rg -o '\b[a-z][a-z0-9]*(-[a-z0-9]+)+\b' <file>  # kebab-case ids
         Filter the extracted tokens against the id inventory from the audit step
         and the DRG node list (yq '.nodes[].id' pack/drg/fragment.yaml) before
         checking for edges. Tokens not in either inventory are not artifact ids —
         do not flag them as missing edges. Numeric directive codes (e.g. "007",
         "038") referenced in prose must also be cross-checked against the
         directive-references list of the artifact being authored.

      2. External references — any of the following appearing in an artifact's text:
           - A URL (http:// or https://)
           - A named third-party product, API, or platform (e.g. OpenAI, LangChain,
             CrewAI, AutoGen, Teams, Zoom, GitHub, AWS, Azure, GCP service names)
           - An external system identifier not covered by any pack toolguide

         For each external reference found:
           a. Check whether a pack toolguide already covers it (look in pack/toolguides/).
           b. If a toolguide exists, add a DRG applies edge from the artifact to that
              toolguide.
           c. If no toolguide exists, flag it as an undocumented external dependency.
              Present the list to the owner and ask: does this external system warrant a
              toolguide? If yes, author one. If no, document the dependency explicitly in
              the artifact's scope or notes field.

         Note: illustrative source-format examples in the procedure's own prose
         (e.g. "LangChain/CrewAI/AutoGen scripts, Cursor rules" used to describe
         what a source agent might be built with) are exempt from this audit rule.
         The external-reference check applies only to the content of the artifacts
         being authored — not to this procedure's descriptive text about possible
         source formats.

      Do not proceed to the profile decision step with unresolved external dependencies
      unless the owner has explicitly acknowledged them.

  - title: Decide whether the agent needs a dedicated agent profile
    actor: human
    description: >
      Not every onboarded agent needs its own profile. Decide explicitly:

        Create an agent profile when the agent represents a distinct, reusable role with its
        own routing, capabilities, and boundaries that team members will invoke by name.

        Do NOT create a profile when the agent's value is fully captured by the extracted
        directives, tactics, and toolguides, and an existing built-in or pack profile can
        carry that behaviour via DRG edges. In that case, record the decision and wire the
        new artifacts to the existing profile instead.

      If a profile is warranted, author it as pack/agent_profiles/<profile-id>.agent.yaml
      with the hyphenated keys profile-id and schema-version, plus roles (min 1) and
      capabilities (min 1). The profile-id slug and display name MUST be an alliteration
      (a role-or-domain descriptor paired with a persona proper name sharing the same initial
      sound, e.g. backend-benny / "Backend Benny"), per the org-charter authoring constraint.

      CRITICAL: do not paste the agent's operating steps into the profile's specialization
      block. Multi-step workflows belong in a procedure or tactic; the profile references them
      through a DRG applies edge. Embedding procedures in a profile is an anti-pattern.

  - title: Register every new artifact in drg/fragment.yaml
    actor: agent
    description: >
      Open pack/drg/fragment.yaml. Add a node entry for each new artifact under the matching
      kind comment block, following the exact indentation and field order of existing entries:

        - id: my-new-tactic
          kind: tactics
          title: My New Tactic
          body_path: tactics/my-new-tactic.tactic.yaml

      Then add edges expressing the artifact's relationships. Common patterns:

        # A directive recommends a tactic:
        - source: MY_DIRECTIVE
          target: my-tactic
          relation: suggests        # or requires when mandatory

        # An agent profile applies a procedure / paradigm / toolguide:
        - source: my-agent-profile
          target: my-procedure
          relation: applies

        # An agent profile mandates a governance directive:
        - source: my-agent-profile
          target: TRACEABLE_DECISIONS
          relation: requires

        # Agent lineage (FR-028: NOT an inline profile field — a DRG edge):
        - source: my-agent-profile
          target: parent-profile
          relation: specializes_from

      Do not author specializes-from as an inline field on the profile YAML; the validator
      rejects it. Lineage and augmentation are DRG edges only.

  - title: Run validation and fix errors
    actor: agent
    description: >
      After writing each artifact (or in batches of 3–5), run:

        spec-kitty doctrine pack validate pack/

      Common errors and fixes:

        "String should match pattern '^[A-Z][A-Z0-9_-]*$'" on an id
          → directive id must be UPPER_SNAKE_CASE.
        "Input should be 'code', 'docs', 'architecture', 'testing', 'operations' or 'glossary'"
          → styleguide scope uses that controlled vocabulary.
        "Field required" on patterns[x].bad_example / anti_patterns[x].good_example
          → both examples are required per entry when the list is present.
        "Extra inputs are not permitted" on a directive
          → directives have no summary/body; use intent and the procedures list.
        Advisory "same_id_collision"
          → the id matches a spec-kitty built-in; declare enhances: <id> or overrides: <id>
            with rationale, or rename if the collision is accidental.

      For template/styleguide pairs, verify bidirectional linkage: the styleguide's
      description or principles[] cites the template slug, and the template front-matter
      cites the styleguide id. Fail the check if either direction is missing.

  - title: Regenerate the compiled DRG
    actor: agent
    description: >
      The runtime reads drg/fragment.yaml, but the committed compiled graph
      (drg/ps-agent-enabled-factory.graph.yaml) must be regenerated so CI and the validator see the
      same node/edge set. Run:

        make compile-drg        # or: python3 tools/compile-drg.py

      Confirm the new nodes and edges appear in the regenerated graph and that the command
      exits cleanly.

  - title: Tag the artifacts to a domain
    actor: agent
    description: >
      Open config/artifact-tags.yaml and tag each new artifact to the domain that governs it,
      so the artifact is filterable and has a clear owner. If the correct domain is not yet
      decided, record the open decision rather than guessing — an artifact tagged to the
      wrong domain creates a misleading ownership signal. A deferred tagging decision is
      acceptable provided it is written down and surfaced to the domain owner.

  - title: Final verification and handoff
    actor: agent
    description: >
      Run the full verification suite:

        spec-kitty doctrine pack validate pack/   # expect 0 errors
        spec-kitty doctor doctrine                # expect pack installed, counts match

      If spec-kitty doctor doctrine is unavailable, verify manually:
        1. rg "^id:" pack/**/*.yaml | sort — no duplicate ids within a kind.
        2. Confirm each new artifact has a DRG node and at least one edge.

      Summarise in the work log: how many artifacts of each kind were created, whether a
      profile was added, the domain tagging decision, and the final validation counts. Hand
      the result back to the agent owner for review before the change is proposed for
      promotion into shared doctrine.

anti_patterns:

  - name: Decomposing before understanding the agent
    description: >
      Jumping to artifact authoring before the owner has been interviewed, the available
      documentation (Markdown and Confluence) gathered, and the agent's purpose confirmed back
      to the owner. Converting an agent you do not fully understand produces artifacts that
      misrepresent its behaviour. Gather the source material and confirm understanding first.

  - name: Lifting the whole prompt into a single artifact
    description: >
      Copying an entire system prompt or rules file (from any source — Cursor, a custom GPT, a
      framework script, etc.) verbatim into one directive or one agent profile.
      A source agent almost always contains several distinct kinds of knowledge — rules,
      techniques, tool usage, and conventions. Decompose it into the correct artifact kinds
      so each piece is independently governable and reusable, rather than trapping everything
      in one opaque blob.

  - name: Embedding the workflow inside the agent profile
    description: >
      Pasting the agent's step-by-step operating instructions into the specialization block of
      the agent_profile YAML. This hides a testable workflow inside a container that is not
      meant to hold procedural content. Extract the workflow as a procedure or tactic and link
      it from the profile via a DRG applies edge.

  - name: Creating an agent profile by default
    description: >
      Authoring a new agent profile for every onboarded agent without checking whether the
      behaviour is already covered by the extracted directives, tactics, and toolguides wired
      to an existing profile. New profiles add routing and maintenance surface; only create one
      when the agent is a distinct reusable role.

  - name: Authoring lineage as an inline profile field
    description: >
      Adding specializes-from: <parent> directly on the agent profile YAML. Under the FR-028
      cutover the AgentProfile validator rejects this field. Express lineage and augmentation
      exclusively as specializes_from edges in drg/fragment.yaml.

  - name: Skipping the compiled DRG regeneration
    description: >
      Editing drg/fragment.yaml but forgetting to run make compile-drg. The runtime sees the
      fragment, but CI and the validator consume the committed compiled graph; an out-of-date
      graph.yaml produces silent divergence between what runs locally and what is reviewed.

  - name: Skipping the existing-artifact overlap audit
    description: >
      Id-only deduplication without semantic read: declaring two artifacts
      non-overlapping because their ids and titles differ, without reading
      their intent or enforcement fields. Two directives with different ids
      can have identical enforcement targets — the duplicate creates governance
      noise and splits authority between two artifacts that say the same thing.
      Always read intent, scope, and enforcement fields before concluding no
      overlap exists.

  - name: Leaving content-DRG inconsistencies unresolved
    description: >
      Citing artifact file paths instead of artifact ids in prose: writing
      "see pack/directives/TRACEABLE_DECISIONS.directive.yaml" or
      "pack/procedures/meeting-minutes-pipeline.procedure.yaml" in an artifact's
      text fields instead of the canonical id ("TRACEABLE_DECISIONS" or
      "meeting-minutes-pipeline"). File paths are not validated by the DRG and
      are fragile to reorganisation; the DRG only tracks id-to-id edges.

  - name: Ignoring external references
    description: >
      Implicit tool dependency without owner acknowledgment: authoring an
      artifact that assumes availability of an external tool, API, or platform
      (e.g. assumes MCP connectivity, assumes a Python runtime, assumes Confluence
      access) and proceeding with the onboarding after the owner has not explicitly
      acknowledged and accepted that external dependency. The "Check content-DRG
      consistency and flag external references" step requires the owner to decide
      whether to author a toolguide or document the dependency — do not treat
      silence as acceptance.

references:
  - type: directive
    id: TRACEABLE_DECISIONS
    reason: Every classification, overlap-versus-augment call, and the profile-or-no-profile decision must be recorded with rationale.
  - type: directive
    id: VERSION_GOVERNANCE
    reason: Onboarded artifacts change doctrine layers and must be versioned with documented change rationale.
  - type: directive
    id: ENSURE_CONCEPTUAL_ALIGNMENT
    reason: Confirm shared understanding of artifact-kind terminology with the owner before decomposing.
  - type: template
    id: source-agent-dossier-template
    reason: Provides the evidence record required before decomposing the external agent.
  - type: template
    id: decomposition-table-template
    reason: Provides the repeatable classification and overlap-audit table used before YAML authoring.
  - type: template
    id: onboarded-artifact-set-template
    reason: Provides the final handoff record for created artifacts, DRG changes, and validation evidence.
