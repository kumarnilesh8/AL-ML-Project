# Regnology PS doctrine pack — DRG fragment
# Additive graph extensions on top of the All-Company layer + spec-kitty built-in DRG.
# Contains nodes and edges that remain PS-specific after the All-Company migration.
#
# Cross-layer references (targets that point outside this fragment):
#   - All-Company promoted artefacts (e.g. REGNOLOGY_BRANDING, MODEL_DISCIPLINE,
#     regnology-mcp, agentic-model-leaderboard) resolve via the parent layer.
#   - Built-in SK profiles (implementer-ivan, curator-carla, designer-dagmar,
#     doctrine-daphne, etc.) resolve in the shipped DRG without a local node.

pack_name: ps-agent-enabled-factory
source_kind: local_path
source_ref: pack
layer_index: 2
provenance_marker: org
# ── Built-in edge endpoints (no local nodes) ────────────────────────────────
# Built-in SK profiles referenced only as edge sources/targets (e.g.
# doctrine-daphne, planner-priti) are intentionally NOT declared as nodes here.
# They resolve at merge time against the shipped/built-in DRG layer — the same
# way every other built-in endpoint in this fragment (implementer-ivan,
# curator-carla, designer-dagmar, …) resolves. Declaring them would mint
# org-tier nodes that shadow the built-ins (same_id_collision). The prior
# top-level `external_nodes:` key was removed: SK v3.2.x OrgDRGFragment forbids
# it (extra_forbidden), and it was functionally redundant — see MIGRATION-2830.
