schema_version: "1.0"
id: sqlx-generation
name: SQLX Generation
purpose: >
  Generate production-ready SQLX artifacts from a structured FU specification: component
  manifest, calculation flow (CF), business logic (BL), dataset definition (DD), and
  decision tables (.dec). Output must be convention-compliant and pass sqlx-validation.
  Use when the task is "generate SQLX from spec" or "implement FU from specification" and
  no SQLX code exists yet (or regeneration from updated spec is requested). Do not use for
  pseudo code interpretation (sqlx-pseudo-code-to-spec), validating existing code (sqlx-validation),
  or generating tests (sqlx-testing).
steps:
  - title: Load Specification and Context
    description: >
      Read the structured specification. Load SQLX coding standards from
      styleguide sqlx-coding-standards. Query the MCP data model for entity schemas and
      field types needed for this FU. If referencing an existing component, read its
      component.sqlx for imports and exports. Prerequisite: complete structured spec with
      resolved data model references (CF/BL/DD and decision tables if any).

  - title: Generate Dataset Definition (_DD.sqlx)
    description: >
      Start with the output contract. Rules: UPPERCASE field names; types String, Double,
      Integer, Date, Boolean; domain references per data model; primary key at end; 4-space
      indentation inside parentheses. Define `dataset FU_OUTPUT ( ... );` with all output
      fields and Primary Key.

  - title: Generate Business Logic (_BL.sqlx)
    description: >
      First line: `unit FU_NAME_BL as function;`. Imports: parameter views passed from CF.
      Intermediate calculations, decision table input view with coalesce() on nullable fields,
      decision table call, final result. Assign result to FU_NAME_BL; export FU_NAME_BL.
      Apply mandatory alphabetical field order in SELECT; coalesce() on ALL nullable DT inputs;
      cast(null as Type) for explicit nulls; table aliases; prefer left outer join.

  - title: Generate Calculation Flow (_CF.sqlx)
    description: >
      First line: `unit FU_NAME_CF;`. Imports alphabetically sorted. Input views: select only
      needed fields, coalesce defaults, joins. Call BL: `FU_NAME_OUT := FU_NAME_BL(VIEW1,
      VIEW2);`. Output selection from FU_NAME_OUT; export with @update/@create only when FU
      modifies an entity; export last.

  - title: Generate Component Manifest (component.sqlx)
    description: >
      First line: `component FU_NAME;`. Imports: base inputs `from input`; upstream FUs
      `from FU_NAME`. Exports. Order: declaration, imports, exports, function registrations.
      For standalone units or initial validation, prefer a single root component.sqlx to avoid
      CLI restrictions on subcomponents.

  - title: Generate Decision Tables (.dec) if applicable
    description: >
      Input/Output declarations at top. Rules separated by `---`; `# Input` and `# Output`
      section headers in each rule. Else Rules: do NOT use `*` wildcard — use a rule with no
      input condition as the catch-all. Operators: in (...), <>, <=, >=, !=, =; string values
      in single quotes.

  - title: Write Files and Produce Report
    description: >
      Write to target FU directory: component.sqlx, FU_NAME_CF.sqlx, FU_NAME_BL.sqlx,
      FU_NAME_DD.sqlx, DEC_*.dec (if any). Folder structure: FU_NAME/ with files as above;
      optional test/ placeholder. Produce a generation report: files produced, conventions
      applied, any deviations.

failure_modes:
  - "Using select * instead of enumerating fields — always list explicit fields in all SELECT statements."
  - "Missing coalesce() on nullable fields in decision table inputs causes runtime errors."
  - "Generic view names (INPUT, OUTPUT) instead of FU-specific names break multi-FU components."
  - "Non-alphabetical field order in SELECT — mandatory alphabetical ordering is enforced by sqlx-validation."
  - "Wildcard * in .dec else rules — use a rule with no input condition as the catch-all instead."

notes: >
  Invoked by SQLX Specialist Simon (sqlx-specialist-simon agent profile) for Generate tasks. Prerequisites: complete
  structured spec, toolguide sqlx-mcp-and-manual.md loaded, SQLX coding standards loaded.
  Exit criteria: all files written, naming and structure match styleguide, run sqlx-validation
  tactic with zero errors before handoff.
